# Copy this file to .github/workflows/claude-code-review.yml in your repository
#
# Required setup:
# 1. Add CLAUDE_CODE_OAUTH_TOKEN to repository secrets

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: outcomeeng/gh-actions/.github/workflows/claude-code-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    # Authorization is automatic: the review runs only when the PR author has
    # admin, maintain, or write permission on this repository (queried via the
    # GitHub API). External contributors are rejected with a clear error.
    #
    # Uncomment and modify to customize:
    # with:
    #   concurrency_cancel: true
    #   custom_prompt: |
    #     REPO: ${{ github.repository }}
    #     PR NUMBER: ${{ github.event.pull_request.number }}
    #
    #     Focus your review on TypeScript type safety and test coverage.
    #     Use `gh pr comment` to post your review.
    #
    # Plugins from .claude/settings.json are NOT installed by default. Most plugin
    # skills demand tools (Read, Grep, Glob, git) that aren't on the wrapper's
    # gh-only allowlist, which produces long runs that never post a comment. To
    # opt in:
    #   use_project_plugins: true
    #   append_allow_list: "Read,Grep,Glob,Bash(git:*)"  # widen the allowlist to match
    #
    # To install specific plugins without enabling all of settings.json:
    #   plugin_marketplaces: "acme-corp/plugins"  # marketplace owner/repo entries
    #   extra_plugins: "internal-style@acme-corp" # plugins to install
    #
    # See README "Plugins and marketplaces" for the full rationale.

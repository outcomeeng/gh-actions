# Copy this file to .github/workflows/claude-code-review.yml in your repository
#
# Required setup:
# 1. Add CLAUDE_CODE_OAUTH_TOKEN to repository secrets
# 2. Adjust authorized_roles if needed

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: outcomeeng/gh-actions/.github/workflows/claude-code-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    # Uncomment and modify to customize:
    # with:
    #   authorized_roles: '["OWNER", "MEMBER"]'
    #   concurrency_cancel: true
    #   custom_prompt: |
    #     REPO: ${{ github.repository }}
    #     PR NUMBER: ${{ github.event.pull_request.number }}
    #
    #     Focus your review on TypeScript type safety and test coverage.
    #     Use `gh pr comment` to post your review.
    #
    # Plugins are read from .claude/settings.json (`enabledPlugins`) and marketplaces
    # from `extraKnownMarketplaces` in the same file. Both flow into the underlying
    # action's `plugins` / `plugin_marketplaces` inputs at runtime. See README
    # "Project marketplace declarations".
    #
    # Optional CI-only overlays (appended to whatever settings.json declares):
    #   plugin_marketplaces: "acme-corp/plugins"  # extra marketplace owner/repo entries
    #   extra_plugins: "internal-style@acme-corp" # extra plugins beyond enabledPlugins

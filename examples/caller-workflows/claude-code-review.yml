# Copy this file to .github/workflows/claude-code-review.yml in your repository
#
# Required setup:
# 1. Add CLAUDE_CODE_OAUTH_TOKEN to repository secrets

name: Claude Code Review

on:
  # `ready_for_review` is deliberately omitted: the event always fires on
  # a SHA that the previous opened/synchronize already reviewed, so
  # subscribing to it would duplicate every promotion review.
  pull_request:
    types: [opened, synchronize, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read # so the reusable can read referenced_workflows to resolve the gh-actions SHA

jobs:
  review:
    # Pin to a full-length commit SHA per GitHub's hardening guidance — never @main or @v1.
    # Renovate keeps this SHA current; the trailing `# main` comment is the branch
    # Renovate tracks. See README "Security" for the full rationale.
    uses: outcomeeng/gh-actions/.github/workflows/claude-code-review.yml@d73bd5470607baa91959ad57691895669f3fe615 # main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    # Authorization is automatic: the review runs only when the PR author has
    # admin, maintain, or write permission on this repository (queried via the
    # GitHub API). External contributors are rejected with a clear error.
    #
    # Uncomment and modify to customize. The reusable defaults
    # `concurrency_cancel` to `true`; set it to `false` to let in-flight
    # reviews complete on push.
    # with:
    #   concurrency_cancel: false
    #   custom_prompt: |
    #     REPO: ${{ github.repository }}
    #     PR NUMBER: ${{ github.event.pull_request.number }}
    #
    #     Focus your review on TypeScript type safety and test coverage.
    #     Use `gh pr comment` to post your review.
    #
    # Wall-clock budget for the Run Claude Code Review step (default 15 in
    # the reusable workflow). Set to a tighter value when running on
    # self-hosted runners so a hung run frees the slot quickly:
    #   timeout_minutes: '5'
    # Or gate it on a repo variable so you can adjust without editing this
    # file (Settings → Secrets and variables → Actions → Variables). The
    # input is typed `string` so quoted forms pass through unchanged:
    #   timeout_minutes: ${{ vars.CLAUDE_REVIEW_TIMEOUT_MINUTES || '15' }}
    # Minimum 1; GitHub Actions silently rejects `0` at runtime.
    #
    # Plugins from .claude/settings.json are NOT installed by default. Most plugin
    # skills demand tools (Read, Grep, Glob, git) that aren't on the wrapper's
    # gh-only allowlist, which produces long runs that never post a comment. To
    # opt in:
    #   use_project_plugins: true
    #   append_allow_list: "Read,Grep,Glob,Bash(git:*)"  # widen the allowlist to match
    #
    # To install specific plugins without enabling all of settings.json:
    #   plugin_marketplaces: "acme-corp/plugins"  # marketplace owner/repo entries
    #   extra_plugins: "internal-style@acme-corp" # plugins to install
    #
    # See README "Plugins and marketplaces" for the full rationale.

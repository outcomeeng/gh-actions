schema_version: 1
repository: outcomeeng/gh-actions
tracked_ref: main
default_expected_sha: f1fb76a6599b6c3baae97c9bf0a38431108cfa78
workflows:
  - id: claude
    example: examples/caller-workflows/claude.yml
    reusable: .github/workflows/claude.yml
    timeout_var: CLAUDE_TIMEOUT_MINUTES
    timeout_default: "30"
  - id: claude-code-review
    example: examples/caller-workflows/claude-code-review.yml
    reusable: .github/workflows/claude-code-review.yml
    timeout_var: CLAUDE_REVIEW_TIMEOUT_MINUTES
    timeout_default: "30"
  - id: product-tree
    example: examples/caller-workflows/product-tree.yml
    reusable: .github/workflows/product-tree.yml
    timeout_var: PRODUCT_TREE_TIMEOUT_MINUTES
    timeout_default: "30"
  - id: product-tree-review
    example: examples/caller-workflows/product-tree-review.yml
    reusable: .github/workflows/product-tree-review.yml
    timeout_var: PRODUCT_TREE_REVIEW_TIMEOUT_MINUTES
    timeout_default: "30"
  - id: product-tree-verification
    example: examples/caller-workflows/product-tree-verification.yml
    reusable: .github/workflows/product-tree-verification.yml
    timeout_var: PRODUCT_TREE_VERIFICATION_TIMEOUT_MINUTES
    timeout_default: "30"

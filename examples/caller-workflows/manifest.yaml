schema_version: 1
repository: outcomeeng/gh-actions
tracked_ref: main
default_expected_sha: a113491956c710dcdb7cb54174b4a52f9f6609d4
workflows:
  - id: claude
    example: examples/caller-workflows/claude.yml
    reusable: .github/workflows/claude.yml
    timeout_var: CLAUDE_TIMEOUT_MINUTES
    timeout_default: "15"
  - id: claude-code-review
    example: examples/caller-workflows/claude-code-review.yml
    reusable: .github/workflows/claude-code-review.yml
    timeout_var: CLAUDE_REVIEW_TIMEOUT_MINUTES
    timeout_default: "15"
  - id: spec-tree
    example: examples/caller-workflows/spec-tree.yml
    reusable: .github/workflows/spec-tree.yml
    timeout_var: SPEC_TREE_TIMEOUT_MINUTES
    timeout_default: "15"
  - id: spec-tree-review
    example: examples/caller-workflows/spec-tree-review.yml
    reusable: .github/workflows/spec-tree-review.yml
    timeout_var: SPEC_TREE_REVIEW_TIMEOUT_MINUTES
    timeout_default: "30"

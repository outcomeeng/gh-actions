[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "outcomeeng-gh-actions-maintenance"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
]

# The importable package is gh_actions. Declared explicitly so setuptools does
# not auto-discover the spx/ spec tree as a second top-level package.
[tool.setuptools]
packages = ["gh_actions"]

[tool.pytest.ini_options]
testpaths = ["spx"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

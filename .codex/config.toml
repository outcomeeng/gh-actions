# Mirrors .claude/settings.json for this repository.
# Global config keeps installed plugins available but disabled by default; this
# project layer enables the repository-specific allowlist.

[plugins."prose@outcomeeng"]
enabled = true

[plugins."spec-tree@outcomeeng"]
enabled = true

# OpenAI-curated GitHub connector.
[plugins."github@openai-curated"]
enabled = true

# SonarQube plugin is installed for the repository agent config.
[plugins."sonarqube@claude-plugins-official"]
enabled = true

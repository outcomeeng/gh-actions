# Resolve the plugin and marketplace lists the Claude Code Action will install.
#
# Two sources combine:
#
# 1. The caller repo's `.claude/settings.json` — consulted only when
#    `use_project_plugins == true`. Reads `enabledPlugins` and the
#    `extraKnownMarketplaces` entries whose `source.source == "github"`.
#    Other source kinds (e.g. local paths) are ignored because they are
#    not reachable from the action runner.
#
# 2. The wrapper's explicit `plugin_marketplaces` and `extra_plugins`
#    inputs — always honored. They APPEND to the settings.json list when
#    `use_project_plugins == true`; they are the sole source when false.
#
# Output format matches the upstream `anthropics/claude-code-action` inputs:
# one entry per line, blank lines stripped. Marketplaces are returned as
# `https://github.com/<owner>/<repo>.git` clone URLs; plugin specs are
# returned verbatim (e.g. `spec-tree@outcomeeng`).

name: Derive Claude plugins and marketplaces
description: |
  Resolve the plugin install list and the marketplaces to register for the
  Claude Code Action, from `.claude/settings.json` (optional) and explicit
  wrapper inputs.

inputs:
  use_project_plugins:
    description: |
      When true, read `.claude/settings.json` from the working directory and
      include its `enabledPlugins` and GitHub-hosted `extraKnownMarketplaces`.
      When false, ignore the file and use only the explicit inputs below.
    required: false
    default: "false"
  plugin_marketplaces:
    description: |
      Space-separated marketplaces to register, formatted as `<owner>/<repo>`.
      The ref portion (if any after `@`) is stripped; pin the marketplace by
      the repo itself, not by ref.
    required: false
    default: ""
  extra_plugins:
    description: |
      Space-separated plugin specs to install (e.g. `spec-tree@outcomeeng`).
    required: false
    default: ""

outputs:
  plugins:
    description: "Newline-separated plugin specs ready for claude-code-action's `plugins` input."
    value: ${{ steps.derive.outputs.plugins }}
  marketplaces:
    description: "Newline-separated marketplace clone URLs ready for claude-code-action's `plugin_marketplaces` input."
    value: ${{ steps.derive.outputs.marketplaces }}

runs:
  using: composite
  steps:
    - name: Derive plugin and marketplace lists
      id: derive
      shell: bash
      env:
        USE_PROJECT_PLUGINS: ${{ inputs.use_project_plugins }}
        PLUGIN_MARKETPLACES: ${{ inputs.plugin_marketplaces }}
        EXTRA_PLUGINS: ${{ inputs.extra_plugins }}
      run: |
        set -euo pipefail
        plugins=""
        marketplaces=""

        if [[ "$USE_PROJECT_PLUGINS" == "true" ]]; then
          if [[ -f .claude/settings.json ]]; then
            jq empty .claude/settings.json
            plugins=$(jq -r '.enabledPlugins // {} | to_entries[] | select(.value == true) | .key' .claude/settings.json)
            marketplaces=$(jq -r '
              .extraKnownMarketplaces // {} | to_entries[]
              | select(.value.source.source == "github")
              | "https://github.com/" + .value.source.repo + ".git"
            ' .claude/settings.json)
          fi
        elif [[ -f .claude/settings.json ]]; then
          echo "::notice::.claude/settings.json found but use_project_plugins is false; its enabledPlugins and extraKnownMarketplaces are ignored. Set use_project_plugins: true to opt in, or list specific plugins via extra_plugins and marketplaces via plugin_marketplaces."
        fi

        # Quoted array expansion so the documented space-separated inputs
        # are tokenised without pathname expansion or word-splitting surprises
        # (a stray `*` or unintended IFS character in the input would otherwise
        # glob against the workspace).
        read -ra extras <<< "$EXTRA_PLUGINS"
        for p in "${extras[@]}"; do
          [[ -z "$p" ]] && continue
          plugins=$(printf '%s\n%s' "$plugins" "$p")
        done

        read -ra markets <<< "$PLUGIN_MARKETPLACES"
        for m in "${markets[@]}"; do
          [[ -z "$m" ]] && continue
          repo=${m%@*}
          marketplaces=$(printf '%s\n%s' "$marketplaces" "https://github.com/${repo}.git")
        done

        plugins=$(echo "$plugins" | sed '/^$/d')
        marketplaces=$(echo "$marketplaces" | sed '/^$/d')

        delim="MULTILINE_$(cat /proc/sys/kernel/random/uuid)"
        {
          echo "plugins<<${delim}"
          echo "$plugins"
          echo "${delim}"
          echo "marketplaces<<${delim}"
          echo "$marketplaces"
          echo "${delim}"
        } >> "$GITHUB_OUTPUT"

        echo "::group::Derived plugin install inputs"
        echo "plugins:"
        echo "$plugins"
        echo "marketplaces:"
        echo "$marketplaces"
        echo "::endgroup::"

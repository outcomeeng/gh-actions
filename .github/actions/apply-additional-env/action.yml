# Export each key of a JSON object as a job-level environment variable.
#
# Used by the Claude Code reusables to forward cloud-provider configuration
# (AWS_REGION, ANTHROPIC_VERTEX_PROJECT_ID, CLOUD_ML_REGION, etc.) to the
# claude-code-action step without changing the action invocation. The caller
# passes a JSON object (the workflow_call input is a single string, since
# workflow_call cannot type objects); this action validates the JSON, rejects
# non-objects, rejects keys that are not valid POSIX env-var names, and writes
# heredoc-delimited GITHUB_ENV records so multiline values (JSON blobs, cert
# material) survive unmangled.

name: Apply additional env from JSON
description: |
  Export each key of a JSON object input as a workflow environment variable.
  Empty input or `{}` is a no-op.

inputs:
  additional_env:
    description: |
      JSON object string. Each key becomes a GITHUB_ENV record; each value is
      coerced via `jq -r '.value | tostring'`, so booleans and numbers serialize
      as strings. Non-object inputs (arrays, scalars) are rejected.
    required: false
    default: "{}"

runs:
  using: composite
  steps:
    - name: Apply additional env
      shell: bash
      env:
        ADDITIONAL_ENV: ${{ inputs.additional_env }}
      run: |
        set -euo pipefail
        if [[ -z "$ADDITIONAL_ENV" || "$ADDITIONAL_ENV" == "{}" ]]; then
          echo "No additional env to apply"
          exit 0
        fi
        # Validate JSON object before exporting; reject non-objects.
        echo "$ADDITIONAL_ENV" | jq -e 'type == "object"' >/dev/null
        # Emit each key as a heredoc-delimited GITHUB_ENV record so multiline
        # values (JSON, cert material, etc.) survive unmangled. Reject keys
        # that aren't valid POSIX env var names so a malformed input can't
        # silently inject garbage.
        while IFS= read -r entry; do
          key=$(printf '%s' "$entry" | jq -r '.key')
          if ! [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::additional_env key '$key' is not a valid env var name"
            exit 1
          fi
          value=$(printf '%s' "$entry" | jq -r '.value | tostring')
          delim="ENV_$(cat /proc/sys/kernel/random/uuid)"
          {
            printf '%s<<%s\n' "$key" "$delim"
            printf '%s\n' "$value"
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"
        done < <(echo "$ADDITIONAL_ENV" | jq -c 'to_entries[]')
        echo "::group::Applied additional env keys"
        echo "$ADDITIONAL_ENV" | jq -r 'keys[]'
        echo "::endgroup::"

# Reusable Claude Code Spec Tree Review workflow.
#
# Wraps `claude-code-review.yml` with spec-tree-specific defaults:
#
# 1. A `REVIEW.md`-aware review prompt that loads the consumer repository's
#    `REVIEW.md` (if present) for finding-classification taxonomy and comment
#    shape, falling back to a `BLOCKING`/`NEEDS-ANSWER`/`FOLLOW-UP` default.
#    The prompt also documents runner constraints (filesystem allowlist,
#    backslash-newline continuations as multiple operations, etc.) that
#    have cost prior runs many wasted tool calls.
#
# 2. An extended allowlist (`Bash(sed:*),Bash(grep:*),Bash(head:*)`) on top
#    of the base review allowlist, so the diff-chunking and comment-composing
#    patterns the prompt teaches do not hit the runner's permission gate.
#
# Usage in caller workflow:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#
#   jobs:
#     spec-tree-review:
#       uses: outcomeeng/gh-actions/.github/workflows/spec-tree-review.yml@main
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# Consumers that need a different prompt or a different baseline allowlist
# should call `claude-code-review.yml` directly instead — this wrapper is
# opinionated about both.

name: Claude Code Spec Tree Review

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner selection — see claude-code-review.yml for full semantics."
        type: string
        default: ubuntu-slim
      concurrency_cancel:
        description: "Cancel in-progress reviews when PR is updated."
        type: boolean
        default: true
      model:
        description: "Claude model to use. Empty means defer to the action's default."
        type: string
        default: ""
      claude_args:
        description: "Extra Claude Code CLI args OTHER than --allowed-tools."
        type: string
        default: ""
      additional_allow_list:
        description: |
          Extra allowlist patterns to append AFTER the spec-tree defaults
          (`Bash(sed:*),Bash(grep:*),Bash(head:*)`). Use when the consumer
          repository needs additional safe tools beyond the spec-tree set.
        type: string
        default: ""
      trigger_phrase:
        description: "Trigger phrase for @-mention activation."
        type: string
        default: "@claude"
      use_bedrock:
        description: "Route Claude through Amazon Bedrock."
        type: boolean
        default: false
      use_vertex:
        description: "Route Claude through Google Vertex AI."
        type: boolean
        default: false
      additional_env:
        description: "JSON object string of env vars to set on the claude-code-action step."
        type: string
        default: "{}"
      use_project_plugins:
        description: "Install plugins declared in the consumer's .claude/settings.json."
        type: boolean
        default: false
      plugin_marketplaces:
        description: "Space-separated additional marketplaces."
        type: string
        default: ""
      extra_plugins:
        description: "Space-separated additional plugins."
        type: string
        default: ""
      show_full_output:
        description: "Stream the full per-turn JSON output to the job log (may include sensitive content)."
        type: boolean
        default: false
      timeout_minutes:
        description: "Wall-clock budget (in minutes) for the Run Claude Code Review step. See claude-code-review.yml for the full contract; declared as a string so callers can forward a `vars.*` repo variable directly."
        type: string
        default: "15"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token. Not required when use_bedrock or use_vertex is true."
        required: false

jobs:
  spec-tree-review:
    uses: ./.github/workflows/claude-code-review.yml
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      concurrency_cancel: ${{ inputs.concurrency_cancel }}
      model: ${{ inputs.model }}
      claude_args: ${{ inputs.claude_args }}
      # Spec-tree-specific allowlist defaults, optionally extended by the caller.
      append_allow_list: ${{ inputs.additional_allow_list && format('Bash(sed:*),Bash(grep:*),Bash(head:*),{0}', inputs.additional_allow_list) || 'Bash(sed:*),Bash(grep:*),Bash(head:*)' }}
      trigger_phrase: ${{ inputs.trigger_phrase }}
      use_bedrock: ${{ inputs.use_bedrock }}
      use_vertex: ${{ inputs.use_vertex }}
      additional_env: ${{ inputs.additional_env }}
      use_project_plugins: ${{ inputs.use_project_plugins }}
      plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
      extra_plugins: ${{ inputs.extra_plugins }}
      show_full_output: ${{ inputs.show_full_output }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      custom_prompt: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        Review this pull request and post one comment with the review. Follow the steps in order. The environment constraints in the "Environment" section below are real — every constraint listed there cost a previous run between 5 and 20 wasted tool calls.

        ## Steps

        1. **Load repository conventions.** Read `REVIEW.md` from the repository root if present. Resolve the finding-classification taxonomy and comment shape in this order: (a) `REVIEW.md` if present, (b) a taxonomy defined in `CLAUDE.md` if `REVIEW.md` is absent, (c) the defaults in the "Review shape" section below if neither file specifies one. Always read `CLAUDE.md` for project conventions independent of where the taxonomy comes from.

        2. **Gather PR context.** Run:

           ```bash
           gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json number,title,body,author,baseRefName,headRefName,additions,deletions,changedFiles
           gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} | sed -n '1,1000p'
           ```

           For longer diffs, keep using the same `sed` form for every chunk — `| sed -n '1001,2000p'`, `| sed -n '2001,3000p'`, and so on. To list affected files first, pipe to `| grep '^diff --git'`; to read around one file, pipe to `| sed -n '/^diff --git a\/path\/to\/file/,/^diff --git /p'`. Use the same `sed -n 'A,Bp'` form when reading any file in the working tree by line range — one process per call, same idiom for any chunk position.

        3. **Compose the review in memory.** Do not write the body to a file. Do not call the `Write` tool. Do not redirect Bash output to disk.

        4. **Post the review with one command, using `printf` and stdin.** The entire `printf … | gh pr comment …` pipeline MUST be one physical shell line. Do not split with `\`-newline continuations — the runner's command parser treats continued lines as separate operations and denies the fragments as unapproved invocations.

           ```bash
           printf '%s\n' '## Spec Tree Review [PR #${{ github.event.pull_request.number }}]: <PR title>' '' '**Summary.** <one or two sentences>' '' '### BLOCKING [correctness]: path/to/file.py:42' 'Evidence: <quote the diff and explain the failure mode>.' 'Required before merge: <concrete change>.' '' '---' '' '## Findings out of scope for merge' '' '### FOLLOW-UP [test-evidence]: path/to/test.py' 'Evidence: <what is missing>.' 'Track under: <issues file or tracker>.' | gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /dev/stdin
           ```

           Quoting rule: wrap literal text in single quotes so `$`, backticks, and backslashes pass through unchanged. Each argument to `printf '%s\n'` is one line of output. Blank lines are `''`. The example above wraps visually in your view, but it is a single physical line — preserve that when you compose your own invocation.

        5. **If you need to revise the comment you just posted,** use `--edit-last` (still one physical line):

           ```bash
           printf '%s\n' '<revised content>' | gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --edit-last --body-file /dev/stdin
           ```

        ## Environment

        The runner sandboxes filesystem writes. The forms below have all been observed to fail in this workflow — skip the rediscovery and use the form in step 4 directly.

        | Do not use | Why |
        | --- | --- |
        | `Write` tool | Blocked by filesystem allowlist; every attempt errors. |
        | `> file`, `tee file`, `cat > file <<EOF` | Same filesystem allowlist applies to Bash redirection outside the repo working tree. |
        | `gh pr comment --body "$(cat <<'EOF' … EOF)"` | Command substitution with embedded heredoc is brittle here and silently truncates on some bodies. |
        | `gh pr comment --body-file /dev/stdin <<HEREDOC` | Heredoc directly to `gh` does not reliably reach the body-file reader. |
        | `gh api repos/<o>/<r>/issues/comments/<id> -X PATCH` | The Actions integration token lacks permission. Use `gh pr comment --edit-last` instead. |
        | `gh pr view <N> --repo <O/R>` without `--json` | Default view fetches `statusCheckRollup`, which the token cannot access. Always pass `--json`, and never request the `statusCheckRollup` field. Safe fields: `number,title,body,author,baseRefName,headRefName,additions,deletions,changedFiles`. |
        | Helper scripts written to disk to assemble the body | Same write blockage; also adds turns for nothing the `printf` form does not already do. |
        | Backslash-newline (`\`) continuations in shell commands | The runner's parser flags continued lines as multiple operations and gates the fragments separately, even when every binary in the pipeline is approved. Keep `printf … \| gh pr comment …` on one physical line. |

        ## Review shape

        Cover, in this order: correctness, project conventions (from `CLAUDE.md`), potential bugs, performance, security, test coverage.

        Classify every finding by required receiver action. When `REVIEW.md` is present, it overrides this default taxonomy.

        | Class | Receiver action | Use when |
        | --- | --- | --- |
        | `BLOCKING` | Fix in this PR before merge | Correctness bug, security risk, data-loss risk, broken required validation, policy violation |
        | `NEEDS-ANSWER` | Answer before merge | A required fact is missing and the answer can clear the concern or upgrade it to `BLOCKING` |
        | `FOLLOW-UP` | Track outside this PR | Justified concern, gap or material improvement, but addressing it would widen the PR or does not affect merge safety |

        Do not use `P0`/`P1`/`P2`/`P3` or `critical`/`high`/`medium`/`low`/`minor`/`nit` as finding headings.

        Finding shape:

        ```text
        ### BLOCKING [correctness]: path/to/file.py:42
        Evidence: <quote the diff or behavior and explain the failure mode>.
        Required before merge: <concrete change>.
        ```

        ```text
        ### NEEDS-ANSWER [test-harness]: path/to/spec-file.md:97
        Reference: <quote the spec, test or implementation code and justify why the question needs to be answered before merge>.
        Question: <concrete question to answer before merge: >.
        ```

        ```text
        ### FOLLOW-UP [test-evidence]: `path/to/foo.compliance.test.ts`
        Issue: <what is missing or worthy of improvement>.
        Track under: <ISSUES.md file or product-specific issue tracker>.
        ```

        If the diff has no `BLOCKING` or `NEEDS-ANSWER` findings, say so directly in the comment. Do not invent lower-priority findings to prove the review happened.

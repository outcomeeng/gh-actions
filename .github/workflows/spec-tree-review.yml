# Reusable Spec Tree Review workflow.
#
# Runs anthropics/claude-code-action on every pull_request with a
# REVIEW.md-aware review prompt and a spec-tree-tuned allowlist
# (`Bash(sed:*),Bash(grep:*),Bash(head:*)` on top of the
# `Bash(gh ...)` baseline used for fetching PR context and posting the
# comment). Bootstrap steps (plugin derivation, claude_args composition,
# additional env application) are inlined rather than factored into
# composite actions so the workflow file the consumer pins is fully
# self-contained — no second checkout of outcomeeng/gh-actions is required
# at runtime.
#
# Usage in caller workflow:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#
#   jobs:
#     spec-tree-review:
#       uses: outcomeeng/gh-actions/.github/workflows/spec-tree-review.yml@<full-commit-sha> # main
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# `ready_for_review` is deliberately omitted from the recommended trigger
# types: it always fires on a SHA the previous `opened` or `synchronize`
# already reviewed (no commits land at the draft→ready transition), so
# subscribing to it would burn a redundant review on every promotion.

name: Spec Tree Review

on:
  workflow_call:
    inputs:
      runner:
        description: |
          Runner selection for all three jobs. Accepts either:
          - A single label: 'ubuntu-slim', 'ubuntu-latest', 'self-hosted'
          - A JSON array of labels: '["self-hosted","laptop"]'
          The workflow detects which form was passed and dispatches correctly.
          Security: self-hosted runners must not be used from public repos or repos that accept PRs from untrusted forks. The validate-workflow gate restricts what untrusted PRs can change, but the runner host itself is shared across runs. Only set a self-hosted runner here when every PR contributor is trusted (typical for private org repos).
        type: string
        default: ubuntu-slim
      concurrency_cancel:
        description: "Cancel in-progress reviews when PR is updated."
        type: boolean
        default: true
      model:
        description: "Claude model to use, e.g. claude-opus-4-7. Folded into claude_args as --model. Empty means defer to the action's default."
        type: string
        default: ""
      claude_args:
        description: |
          Extra CLI arguments for Claude Code OTHER than --allowed-tools.
          For tool restrictions, use append_allow_list / override_allow_list.
          Examples: '--max-turns 20', '--debug', '--mcp-config /path/to/cfg'.
        type: string
        default: ""
      append_allow_list:
        description: |
          Comma-separated tool patterns appended to the workflow's baseline
          allowlist (the `Bash(gh ...)` patterns used for PR context plus the
          spec-tree defaults `Bash(sed:*),Bash(grep:*),Bash(head:*)`). Use
          Claude Code's --allowed-tools pattern syntax. Example:
          'Bash(make test:*),Bash(yarn lint:*)'. Ignored when
          override_allow_list is set.
        type: string
        default: ""
      override_allow_list:
        description: |
          Comma-separated tool patterns that replace the workflow's entire
          baseline allowlist (the `Bash(gh ...)` patterns AND the spec-tree
          defaults). Use Claude Code's --allowed-tools pattern syntax.
          Example: 'Bash(gh pr view:*),Bash(gh pr comment:*)'. Use when you
          need a strictly different allowlist than the bake-in; note that
          the baked-in prompt depends on `sed`, `grep`, and `head` for
          diff chunking, so dropping those will burn turns on permission
          denials.
        type: string
        default: ""
      trigger_phrase:
        description: |
          Trigger phrase forwarded to the action. Review does not use this to
          gate the run (review fires on every pull_request event), but the
          phrase is passed to the action for content-matching. Defaults to
          `@spec-tree`.
        type: string
        default: "@spec-tree"
      use_bedrock:
        description: "Route Claude through Amazon Bedrock instead of the Claude API. Caller is responsible for AWS auth and for setting AWS_REGION via additional_env."
        type: boolean
        default: false
      use_vertex:
        description: "Route Claude through Google Vertex AI instead of the Claude API. Caller is responsible for GCP auth and for setting ANTHROPIC_VERTEX_PROJECT_ID / CLOUD_ML_REGION / VERTEX_REGION_* via additional_env."
        type: boolean
        default: false
      additional_env:
        description: "JSON object string of env vars to set on the claude-code-action step. Used to pass cloud-provider config without changing the action invocation."
        type: string
        default: "{}"
      use_project_plugins:
        description: |
          Install plugins declared in the consumer's .claude/settings.json.
          Defaults to FALSE because this workflow's allowlist is narrow;
          opting in requires widening it via `append_allow_list` (or
          replacing it via `override_allow_list`) to match the tools the
          project plugins rely on. The consumer's .claude/settings.json
          should list the required plugins under `enabledPlugins` AND
          register their hosting marketplaces under
          `extraKnownMarketplaces` (entries with `source.source ==
          "github"`); the marketplace registration is what
          claude-code-action uses to resolve each `<plugin>@<owner>` spec
          at install time.
        type: boolean
        default: false
      plugin_marketplaces:
        description: "Space-separated list of marketplaces to register (`owner/repo`, ref ignored — pin via the marketplace repo). Appends to the project's `extraKnownMarketplaces` when use_project_plugins is true; sole source when false."
        type: string
        default: ""
      extra_plugins:
        description: "Space-separated list of plugins to install. Appends to the project's `enabledPlugins` when use_project_plugins is true; sole source when false."
        type: string
        default: ""
      show_full_output:
        description: |
          Stream the full per-turn JSON output from Claude Code to the job log instead of the default redacted summary. WARNING (per the upstream action): the full output includes ALL tool execution results, which may contain secrets, API keys, or other sensitive material from the repo. GitHub Actions job logs are visible to anyone with read access to the repository (and to the public for public repos). Only enable when debugging in a non-sensitive context.
        type: boolean
        default: false
      timeout_minutes:
        description: |
          Wall-clock budget (in minutes) for the Run Claude Code Review step. When exceeded, GitHub cancels the step with a clear timeout message; the post-action cleanup steps still run, so the runner is left in a clean state. Default 30 covers longer spec-tree reviews with cleanup headroom. Lower it (e.g. to '5') to fail fast when a run hangs, or raise it for repositories where reviews legitimately take longer. Minimum meaningful value is 1; GitHub Actions silently rejects `timeout-minutes: 0` at runtime. Applies only to the Claude Code Action step; the authorize and validate-workflow jobs are short-lived and not gated by this input. Declared as a string so callers can forward a `vars.*` repo variable directly (`vars.*` always reads as a string); numeric literals like `30` are also accepted because GitHub Actions coerces them to strings on input.
        type: string
        default: "30"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token. Not required when use_bedrock or use_vertex is true (cloud credentials provide auth in those cases)."
        required: false

# Deny-all default at the workflow level. Each job below explicitly grants
# the narrow permissions it needs (subject to the caller workflow's maximum
# grant). This guards against future jobs accidentally inheriting broad
# permissions; see https://docs.github.com/en/actions/security-guides/automatic-token-authentication.
permissions: {}

jobs:
  validate-workflow:
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
    outputs:
      matches: ${{ steps.check.outputs.matches }}
    steps:
      - name: Validate runner dependencies
        run: |
          set -euo pipefail
          missing=()
          for cmd in gh jq; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              missing+=("$cmd")
            fi
          done
          if ((${#missing[@]})); then
            printf 'Missing required command(s): %s\n' "${missing[*]}" >&2
            printf 'Install the missing command(s) on the runner image or choose a runner that already provides them.\n' >&2
            exit 1
          fi

      - name: Compare caller workflow file to default branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # github.workflow_ref is "<owner>/<repo>/<path>@<ref>".
          prefix="$REPO/"
          path="${WORKFLOW_REF#"$prefix"}"
          path="${path%@*}"
          echo "Caller workflow file: $path"

          default_branch=$(gh api "repos/$REPO" --jq '.default_branch')
          head_sha_blob=$(gh api "repos/$REPO/contents/$path?ref=$HEAD_SHA" --jq '.sha' 2>/dev/null || echo "")
          default_sha_blob=$(gh api "repos/$REPO/contents/$path?ref=$default_branch" --jq '.sha' 2>/dev/null || echo "")

          if [[ -z "$default_sha_blob" ]]; then
            echo "::notice::Workflow file '$path' is not on $default_branch yet. The Anthropic action requires the caller workflow file to exist on the default branch with identical content. Merge this PR (or a workflow-only PR that lands the file first) into $default_branch, then subsequent PRs will be reviewed automatically."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$head_sha_blob" ]]; then
            echo "::notice::Workflow file '$path' is not present at the PR head; nothing to review here."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$head_sha_blob" != "$default_sha_blob" ]]; then
            echo "::notice::Workflow file '$path' at PR head differs from $default_branch. The Anthropic action requires identical content for security. Land the workflow change on $default_branch first (a workflow-only PR is the typical approach), then this PR will be reviewed automatically."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Workflow file at PR head matches $default_branch — review can proceed"
          echo "matches=true" >> "$GITHUB_OUTPUT"

  authorize:
    needs: validate-workflow
    if: needs.validate-workflow.outputs.matches == 'true'
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Validate trigger phrase
        env:
          TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        run: |
          set -euo pipefail
          # The review workflow fires on every `pull_request` event
          # regardless of `trigger_phrase`, so a whitespace-only value
          # cannot cause the unbounded-firing failure mode the mention
          # workflow guards against. The same validation is applied here
          # for consistency and to defend against future changes that
          # might introduce comment-matching logic relying on a
          # non-empty trigger phrase. Reject empty and whitespace-only
          # trigger phrases.
          if [[ -z "${TRIGGER_PHRASE//[[:space:]]/}" ]]; then
            echo "::error::trigger_phrase is empty or whitespace-only. Set inputs.trigger_phrase, or the SPEC_TREE_REVIEW_TRIGGER_PHRASE repo variable, to a meaningful mention string (e.g. '@spec-tree')."
            exit 1
          fi

      - name: Check PR author permission
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$PR_AUTHOR" ]]; then
            echo "::notice::No PR author in the event payload; skipping review"
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          err=$(mktemp)
          perm_status=0
          perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq '.permission' 2>"$err") || perm_status=$?
          if [[ "$perm_status" != "0" ]]; then
            if grep -q 'Not Found' "$err"; then
              perm="none"
            else
              cat "$err" >&2
              rm -f "$err"
              exit "$perm_status"
            fi
          fi
          rm -f "$err"
          case "$perm" in
            admin|maintain|write)
              echo "PR author '$PR_AUTHOR' has '$perm' permission on $REPO — review authorized"
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::PR author '$PR_AUTHOR' has '$perm' permission on $REPO; skipping review (review requires admin, maintain, or write)"
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  spec-tree-review:
    needs: [authorize, validate-workflow]
    if: needs.authorize.outputs.authorized == 'true' && needs.validate-workflow.outputs.matches == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: ${{ inputs.concurrency_cancel }}
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Derive Claude plugins and marketplaces
        id: plugins
        env:
          USE_PROJECT_PLUGINS: ${{ inputs.use_project_plugins }}
          PLUGIN_MARKETPLACES: ${{ inputs.plugin_marketplaces }}
          EXTRA_PLUGINS: ${{ inputs.extra_plugins }}
        run: |
          set -euo pipefail
          plugins=""
          marketplaces=""

          if [[ "$USE_PROJECT_PLUGINS" == "true" ]]; then
            if [[ -f .claude/settings.json ]]; then
              jq empty .claude/settings.json
              # `enabledPlugins` must be an object of the form
              # `{"<plugin>@<owner>": true}` — Claude Code's own
              # settings-schema shape. Arrays or scalars would parse silently
              # to an empty install list with no warning, so reject them here.
              if ! jq -e '(.enabledPlugins // {}) | type == "object"' .claude/settings.json >/dev/null; then
                echo "::warning::.claude/settings.json has enabledPlugins that is not a JSON object; expected the {\"<plugin>@<owner>\": true} shape. Ignoring it." >&2
              else
                plugins=$(jq -r '.enabledPlugins // {} | to_entries[] | select(.value == true) | .key' .claude/settings.json)
              fi
              marketplaces=$(jq -r '
                .extraKnownMarketplaces // {} | to_entries[]
                | select(.value.source.source == "github")
                | "https://github.com/" + .value.source.repo + ".git"
              ' .claude/settings.json)
            fi
          fi

          # Quoted array expansion so the documented space-separated inputs
          # are tokenised without pathname expansion or word-splitting surprises
          # (a stray `*` or unintended IFS character in the input would otherwise
          # glob against the workspace).
          read -ra extras <<< "$EXTRA_PLUGINS"
          for p in "${extras[@]}"; do
            [[ -z "$p" ]] && continue
            plugins=$(printf '%s\n%s' "$plugins" "$p")
          done

          read -ra markets <<< "$PLUGIN_MARKETPLACES"
          for m in "${markets[@]}"; do
            [[ -z "$m" ]] && continue
            repo=${m%@*}
            marketplaces=$(printf '%s\n%s' "$marketplaces" "https://github.com/${repo}.git")
          done

          plugins=$(echo "$plugins" | sed '/^$/d')
          marketplaces=$(echo "$marketplaces" | sed '/^$/d')

          delim="MULTILINE_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "plugins<<${delim}"
            echo "$plugins"
            echo "${delim}"
            echo "marketplaces<<${delim}"
            echo "$marketplaces"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

          echo "::group::Derived plugin install inputs"
          echo "plugins:"
          echo "$plugins"
          echo "marketplaces:"
          echo "$marketplaces"
          echo "::endgroup::"

      - name: Compose claude_args
        id: claude-args
        env:
          MODEL: ${{ inputs.model }}
          EXTRA_ARGS: ${{ inputs.claude_args }}
          APPEND_ALLOW_LIST: ${{ inputs.append_allow_list }}
          OVERRIDE_ALLOW_LIST: ${{ inputs.override_allow_list }}
          # Baseline allowlist: the `Bash(gh ...)` patterns the prompt needs
          # to read PR context and post the review comment, plus the
          # spec-tree defaults (sed/grep/head) for diff chunking.
          BASELINE_ALLOW_LIST: "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(sed:*),Bash(grep:*),Bash(head:*)"
        run: |
          set -euo pipefail
          # Trim leading/trailing whitespace so a caller passing " " (or a
          # YAML block with trailing newline) doesn't append a stray empty
          # pattern that Claude Code would silently drop or reject.
          trim() { local s=${1#"${1%%[![:space:]]*}"}; printf '%s' "${s%"${s##*[![:space:]]}"}"; }
          MODEL=$(trim "$MODEL")
          EXTRA_ARGS=$(trim "$EXTRA_ARGS")
          APPEND_ALLOW_LIST=$(trim "$APPEND_ALLOW_LIST")
          OVERRIDE_ALLOW_LIST=$(trim "$OVERRIDE_ALLOW_LIST")

          if [[ -n "$OVERRIDE_ALLOW_LIST" ]]; then
            allowlist="$OVERRIDE_ALLOW_LIST"
            if [[ -n "$APPEND_ALLOW_LIST" ]]; then
              echo "::warning::append_allow_list is ignored because override_allow_list is set."
            fi
          elif [[ -n "$APPEND_ALLOW_LIST" ]]; then
            allowlist="$BASELINE_ALLOW_LIST,$APPEND_ALLOW_LIST"
          else
            allowlist="$BASELINE_ALLOW_LIST"
          fi
          # Literal double-quotes around the allowlist are required: baseline
          # patterns like `Bash(gh issue view:*)` contain whitespace, and
          # claude-code-action shlex-splits `claude_args` before forwarding to
          # the CLI. Without the quotes, the embedded spaces would split the
          # value across argv positions and `--allowed-tools` would receive
          # only the first token.
          args="--allowed-tools \"$allowlist\""

          if [[ -n "$MODEL" ]]; then
            args="$args --model $MODEL"
          fi

          if [[ -n "$EXTRA_ARGS" ]]; then
            # Help callers spot the design mismatch — they should be using
            # the allow-list inputs for tool restrictions.
            if [[ "$EXTRA_ARGS" == *--allowed-tools* || "$EXTRA_ARGS" == *--allowedTools* ]]; then
              echo "::warning::claude_args contains --allowed-tools; this will merge additively with the composed allowlist (the action treats repeated flags as a Set). To narrow the allowlist, use override_allow_list; to extend, use append_allow_list."
            fi
            args="$args $EXTRA_ARGS"
          fi

          delim="ARGS_${RANDOM}${RANDOM}${RANDOM}"
          {
            printf '%s<<%s\n' "args" "$delim"
            printf '%s\n' "$args"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "::group::Composed claude_args"
          printf '%s\n' "$args"
          echo "::endgroup::"

      - name: Apply additional env
        env:
          ADDITIONAL_ENV: ${{ inputs.additional_env }}
        run: |
          set -euo pipefail
          if [[ -z "$ADDITIONAL_ENV" || "$ADDITIONAL_ENV" == "{}" ]]; then
            echo "No additional env to apply"
            exit 0
          fi
          # Validate JSON object before exporting; reject non-objects.
          echo "$ADDITIONAL_ENV" | jq -e 'type == "object"' >/dev/null
          # Emit each key as a heredoc-delimited GITHUB_ENV record so multiline
          # values (JSON, cert material, etc.) survive unmangled. Reject keys
          # that aren't valid POSIX env var names so a malformed input can't
          # silently inject garbage.
          while IFS= read -r entry; do
            key=$(printf '%s' "$entry" | jq -r '.key')
            if ! [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::additional_env key '$key' is not a valid env var name"
              exit 1
            fi
            value=$(printf '%s' "$entry" | jq -r '.value | tostring')
            delim="ENV_${RANDOM}${RANDOM}${RANDOM}"
            {
              printf '%s<<%s\n' "$key" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
          done < <(echo "$ADDITIONAL_ENV" | jq -c 'to_entries[]')
          echo "::group::Applied additional env keys"
          echo "$ADDITIONAL_ENV" | jq -r 'keys[]'
          echo "::endgroup::"

      - name: Run Claude Code Review
        id: claude-review
        # `inputs.timeout_minutes` is declared as a string (so callers can
        # forward a `vars.*` value directly), but step-level `timeout-minutes:`
        # rejects string values outright. fromJSON() parses "30" back to the
        # integer 30 that the field expects. The `|| '30'` fallback covers
        # the edge case where a caller passes `timeout_minutes: ""`
        # explicitly (which overrides the input default) — without it,
        # fromJSON("") would throw an opaque workflow error.
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '30') }}
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: ${{ steps.claude-args.outputs.args }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          use_bedrock: ${{ inputs.use_bedrock }}
          use_vertex: ${{ inputs.use_vertex }}
          plugins: ${{ steps.plugins.outputs.plugins }}
          plugin_marketplaces: ${{ steps.plugins.outputs.marketplaces }}
          show_full_output: ${{ inputs.show_full_output }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request and post one comment with the review. Follow the steps in order. The environment constraints in the "Environment" section below are real — every constraint listed there cost a previous run between 5 and 20 wasted tool calls.

            ## Steps

            1. **Load repository conventions.** Read `REVIEW.md` from the repository root if present. Resolve the finding-classification taxonomy in this order: (a) `REVIEW.md` if present, (b) a taxonomy defined in `CLAUDE.md` if `REVIEW.md` is absent, (c) the defaults in the "Spec Tree Review Workflow" section below if neither file specifies one. Always read `CLAUDE.md` for project conventions independent of where the taxonomy comes from.

            2. **Gather PR context.** Run:

               ```bash
               gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json number,title,body,author,baseRefName,headRefName,additions,deletions,changedFiles
               gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} | sed -n '1,1000p'
               ```

               For longer diffs, keep using the same `sed` form for every chunk — `| sed -n '1001,2000p'`, `| sed -n '2001,3000p'`, and so on. To list affected files first, pipe to `| grep '^diff --git'`; to read around one file, pipe to `| sed -n '/^diff --git a\/path\/to\/file/,/^diff --git /p'`. Use the same `sed -n 'A,Bp'` form when reading any file in the working tree by line range — one process per call, same idiom for any chunk position.

            3. **Compose the review in memory.** Do not write the body to a file. Do not call the `Write` tool. Do not redirect Bash output to disk.

            4. **Post the review with one command, using `printf` and stdin.** The entire `printf … | gh pr comment …` pipeline MUST be one physical shell line. Do not split with `\`-newline continuations — the runner's command parser treats continued lines as separate operations and denies the fragments as unapproved invocations.

               ```bash
               printf '%s\n' '### BLOCKING [consistency]: path/to/file.py:42' 'Reference: <quote the standard from CLAUDE.md, a skill, or governance doc (PDR/ADR/spec)>.' 'Evidence: <quote the diff and explain the disagreement between layers>.' 'Required: <concrete change>.' '' '### DEBT [evidence]: path/to/test.py' 'Reference: <quote the standard or assertion>.' 'Evidence: <quote the diff and explain the gap>.' 'Required: <concrete change>.' | gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /dev/stdin
               ```

               Quoting rule: wrap literal text in single quotes so `$`, backticks, and backslashes pass through unchanged. Each argument to `printf '%s\n'` is one line of output. Blank lines are `''`. The example above wraps visually in your view, but it is a single physical line — preserve that when you compose your own invocation.

            5. **If you need to revise the comment you just posted,** use `--edit-last` (still one physical line):

               ```bash
               printf '%s\n' '<revised content>' | gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --edit-last --body-file /dev/stdin
               ```

            ## Environment

            The runner sandboxes filesystem writes. The forms below have all been observed to fail in this workflow — skip the rediscovery and use the form in step 4 directly.

            | Do not use | Why |
            | --- | --- |
            | `Write` tool | Blocked by filesystem allowlist; every attempt errors. |
            | `> file`, `tee file`, `cat > file <<EOF` | Same filesystem allowlist applies to Bash redirection outside the repo working tree. |
            | `gh pr comment --body "$(cat <<'EOF' … EOF)"` | Command substitution with embedded heredoc is brittle here and silently truncates on some bodies. |
            | `gh pr comment --body-file /dev/stdin <<HEREDOC` | Heredoc directly to `gh` does not reliably reach the body-file reader. |
            | `gh api repos/<o>/<r>/issues/comments/<id> -X PATCH` | The Actions integration token lacks permission. Use `gh pr comment --edit-last` instead. |
            | `gh pr view <N> --repo <O/R>` without `--json` | Default view fetches `statusCheckRollup`, which the token cannot access. Always pass `--json`, and never request the `statusCheckRollup` field. Safe fields: `number,title,body,author,baseRefName,headRefName,additions,deletions,changedFiles`. |
            | Helper scripts written to disk to assemble the body | Same write blockage; also adds turns for nothing the `printf` form does not already do. |
            | Backslash-newline (`\`) continuations in shell commands | The runner's parser flags continued lines as multiple operations and gates the fragments separately, even when every binary in the pipeline is approved. Keep `printf … \| gh pr comment …` on one physical line. |

            ## Spec Tree Review Workflow

            These concerns and severities apply when the repository has no `REVIEW.md`; when `REVIEW.md` defines its own taxonomy, follow that instead.

            Inspect the changeset under review and the checked out working tree. Emit findings only when they exist. Provide no praise or commentary that is neither a finding nor a tracking commitment. Never modify any file in the working tree; classification is the only output.

            **ALWAYS:** report findings. When the changeset omits a fact a finding depends on, frame the finding as worst-case or conditional. Example: "Evidence: cannot verify X from the changeset; if assumption Y holds, this breaks Z because …"

            **NEVER:** emit open questions or speculative commentary that does not constitute a finding. Questions add CI roundtrips this single-pass review cannot recover from.

            **For each new validator, check, or derivation introduced by the changeset:** name the configuration inputs it reads (env vars, config keys, CLI flags, file-system state) and confirm it handles every documented value of each input, not just the default. An override that the canonical path honors but the new path ignores is a `consistency` finding even when the default-config behavior is identical.

            Every finding has two dimensions: **concern** and **severity**. Use only these 5 concerns and 2 severities.

            ## **Concern:** Classify all your findings into one of 5 concerns, grouped by three axes

            **What the code does vs. what it is supposed to do**

            - **Consistency:** equivalence across the layers AND across the codebase. Vertical: a lower layer disagrees with a higher one — decisions (PDRs and ADRs) → spec → tests/evals → implementation. Horizontal: a new code path re-derives a value (a name, id, path, label, status, decision) that an existing function in the repo already derives, and the two derivations disagree on any documented input — especially optional/override inputs (env vars, config flags, fallbacks). When the changeset introduces such a derivation, locate the existing helper with `grep` and confirm agreement across every documented input. The reviewer surfaces the disagreement; they do not judge which side is right.
            - **Security:** confidentiality, integrity, availability.
            - **Performance:** unbounded loops, hot-path allocations, O(n^2) traversals where O(n) suffices, synchronous I/O on async paths, and similar pessimisations that change the changeset's runtime characteristics under realistic load.

            **How we know it does what it is supposed to do**

            - **Evidence:** inadequate coverage of declared assertions by tests or evals; unmaintainable tests (literals, magic numbers, test-owned constants, duplication); evals that no longer exercise the assertions they claim to.

            **How it does what it is supposed to do**

            - **Architecture:** violation of structural principles declared by ADRs or PDRs — layer boundaries, separation of concerns, dependency directions, module-shape rules. A finding is an architecture one when the structure itself is at odds with a governance principle, even if every layer is internally consistent.

            ## **Severity:** triage each finding to one of 2 levels

            | Severity   | Use when                                                                                                 |
            | ---------- | -------------------------------------------------------------------------------------------------------- |
            | `BLOCKING` | Merge-safety defect: if deployed, the changeset would create a deterministic issue or pose a risk.       |
            | `DEBT`     | Real defect that does not jeopardize merge safety: a problem the change carries, but not merge-blocking. |

            Severity names what the finding is, never how much work it is. Whether a `DEBT` finding is fixed in this pull request or recorded and tracked elsewhere is the author's disposition to judge, not yours — so never reach for a third, scope-shaped severity, a severity rank (`P0`–`P3`, `critical`/`high`/`medium`/`low`/`minor`/`nit`), or a legacy class label (`NEEDS-ANSWER`, `NOTE`). An out-of-scope-looking finding is a `DEBT` finding; the author decides where it goes.

            ## **Reporting:** Return your findings exactly as below

            The bracket after the severity names the concern: one of `consistency`, `security`, `performance`, `evidence`, `architecture`.

            Both severities use the same fields: `Reference:` + `Evidence:` + `Required:`. `Required:` names the change the finding asks for; whether that change lands in this pull request or is recorded and tracked is the author's to decide, not something the field shape settles.

            ## **Reference discipline:** cite only loaded repository-governed rules

            Before citing a rule:

            - Locate and read the cited text in a file that exists in the repository under review or in a loaded skill file that governs that repository. Use the citation only when that file contains the cited rule, assertion, or governing section.
            - Treat rules recalled from system prompts, user/global instructions outside the repository, prior sessions, or training as invalid review citations.
            - Drop the finding when the candidate rule cannot be located; do not downgrade it or report it with a weaker citation.
            - Leave authored-instruction conformance to the audit verification kind, and static analysis to the validate verification kind; both are separate from review. That a file departs from a documented convention — comment length, docstring length, a naming or formatting habit — is those kinds' finding to make, not this review's, and none of the five concerns above is a home for it.

            ```text
            ### BLOCKING [consistency]: path/to/file.py:42
            Reference: <quote the standard from CLAUDE.md, skills, governance from decisions (PDR/ADR) or assertion from specs>.
            Evidence: <quote the diff or behavior and explain the disagreement between layers>.
            Required: <concrete change>.
            ```

            ```text
            ### DEBT [architecture]: path/to/file.py:97
            Reference: <quote the standard from CLAUDE.md, skills, governance from decisions (PDR/ADR) or assertion from specs>.
            Evidence: <quote the diff or behavior and explain how it violates the structural principle>.
            Required: <concrete change>.
            ```

            ## **Completeness:** Aim for *first-time right*

            Each review pass is independent and self-contained — there is no cross-pass continuity, and CI replays the prompt from scratch on every `pull_request` event. Surface every finding the changeset exhibits in the **first** pass against that changeset; a finding missed on pass 1 has no second chance unless the diff itself changes.

            Read the diff once, methodically, across all concerns. Then identify the highest-risk files in the changeset — typically new or substantially-rewritten runtime logic, security-sensitive paths, and modules with cross-file invariants — and make a focused second pass on those files: open the full file with `sed -n 'A,Bp'`, and `grep` the working tree for the existing helpers, callers, and collaborators each new function interacts with. A 10k-line diff read in 1000-line chunks puts material in context but does not by itself produce the cross-file inferences `consistency` and `architecture` findings depend on; the second pass is what closes that gap.

            ## **No findings:** confirm the cross-checks first

            Before posting "no findings", for each substantially new runtime function the changeset introduces, state internally which existing collaborator or canonical helper it must agree with, and confirm the agreement by reading both with `sed` and `grep`. A single satisfied sub-check — for example, an env-var override at one layer — does not clear the area; name the collaborator and verify the relationship explicitly. When every such cross-check passes, post a one-line comment saying so. NEVER invent lower-priority findings to prove the review happened, and NEVER generalize "no gap here" from one verified relationship to the whole area.

      - name: Verify the agent run completed
        # The invoking action derives its own outcome from the result record's
        # `subtype` and does not consult `is_error`, so a run that aborted
        # still leaves the step green — an expired credential produces
        # `{"subtype": "success", "is_error": true, "num_turns": 1,
        # "total_cost_usd": 0}` in under two seconds. Without this step the
        # check reports a completed agent run that never happened.
        #
        # This resolves completion only. It never reads the agent's findings:
        # a run that completes and reports nothing passes exactly like one
        # that reports many, so the findings-only boundary is preserved.
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail

          if [[ -z "${EXECUTION_FILE:-}" || ! -f "$EXECUTION_FILE" ]]; then
            echo "::error::The agent wrote no execution record, so this check cannot stand for a completed agent run. Inspect the preceding step's log." >&2
            exit 1
          fi

          # A run killed mid-write leaves a truncated record, and a record whose
          # top level is not the array of messages the reader below iterates
          # would make that reader throw. Reject both here so every malformed
          # record produces the same actionable message rather than a raw jq
          # error under `set -e`.
          if ! jq -e 'type == "array"' "$EXECUTION_FILE" >/dev/null 2>&1; then
            echo "::error::The agent's execution record is not a JSON array of messages, so the run ended before finishing its log. Inspect the preceding step's log." >&2
            exit 1
          fi

          result=$(jq -c 'map(select(.type == "result")) | last // empty' "$EXECUTION_FILE")
          if [[ -z "$result" ]]; then
            echo "::error::The agent's execution record carries no result entry, so the run ended before reporting an outcome. Inspect the preceding step's log." >&2
            exit 1
          fi

          is_error=$(printf '%s' "$result" | jq -r '.is_error // false')
          subtype=$(printf '%s' "$result" | jq -r '.subtype // ""')

          if [[ "$is_error" == "true" || "$subtype" != "success" ]]; then
            printf '%s\n' "$result" | jq -r '
              "Agent run did not complete: subtype=\(.subtype // "none") " +
              "is_error=\(.is_error // false) turns=\(.num_turns // 0) " +
              "cost_usd=\(.total_cost_usd // 0) duration_ms=\(.duration_ms // 0)"
            ' >&2
            echo "::error::The agent run reported an error, so this check does not stand for a completed agent run." >&2
            # One turn at zero cost means the run was rejected before it did any
            # work; that is an authentication result, not a review outcome, and
            # it needs different remediation than a run that worked and failed.
            turns=$(printf '%s' "$result" | jq -r '.num_turns // 0')
            cost=$(printf '%s' "$result" | jq -r '.total_cost_usd // 0')
            if [[ "$turns" -le 1 ]] && [[ "$cost" == "0" ]]; then
              echo "::error::The run was rejected before it began — one turn at zero cost. Verify the agent credential this workflow receives is present and unexpired." >&2
            fi
            exit 1
          fi

          echo "Agent run completed: $(printf '%s' "$result" | jq -r '"turns=\(.num_turns // 0) cost_usd=\(.total_cost_usd // 0)"')"

# Reusable Spec Tree verification host.
#
# Runs a caller-selected marketplace skill against a pull request through a
# sanitized coding-agent CLI subprocess. The workflow owns GitHub plumbing,
# checkout, authorization, filtering, and summaries; verdict judgment stays in
# the installed skill.

name: Spec Tree Verification

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner selection. Accepts a single label or a JSON array string."
        type: string
        default: ubuntu-slim
      skill:
        description: "Skill name to invoke, without a leading slash. Example: review-changes."
        type: string
        default: review-changes
      skill_repository:
        description: "GitHub repository that contains the skill plugin source."
        type: string
        default: outcomeeng/plugins
      ref:
        description: "Git ref for the skill source. Production callers must pass a full commit SHA; branch refs require allow_branch_preview plus the BETA TESTER marker."
        type: string
        required: true
      skill_path:
        description: "Path within the skill repository to the agent plugin directory."
        type: string
        default: src/plugins/spec-tree
      agent:
        description: "Agent adapter. Supported values: claude-code, codex."
        type: string
        default: claude-code
      model:
        description: "Agent model id. Empty means defer to the selected CLI default."
        type: string
        default: ""
      paths:
        description: "Optional newline-separated changed-path globs. Empty means every PR change is in scope."
        type: string
        default: ""
      concurrency_suffix:
        description: "Optional discriminator for callers that run the same skill more than once on one pull request."
        type: string
        default: ""
      allow_branch_preview:
        description: "Allow a same-repo branch preview with a floating skill ref when the caller carries the BETA TESTER marker."
        type: boolean
        default: false
      spx_version:
        description: "Version of @outcomeeng/spx to install."
        type: string
        default: "0.6.7" # renovate: datasource=npm depName=@outcomeeng/spx
      claude_code_version:
        description: "Version of @anthropic-ai/claude-code to install."
        type: string
        default: "2.1.195" # renovate: datasource=npm depName=@anthropic-ai/claude-code
      codex_version:
        description: "Version of @openai/codex to install."
        type: string
        default: "0.146.0" # renovate: datasource=npm depName=@openai/codex
      timeout_minutes:
        description: "Wall-clock budget in minutes for the agent step."
        type: string
        default: "30"
    secrets:
      ANTHROPIC_API_KEY:
        description: "Anthropic API key used by Claude Code in --bare mode."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token used when ANTHROPIC_API_KEY is not set."
        required: false
      CODEX_ACCESS_TOKEN:
        description: "Codex access token for ChatGPT-workspace subscription authentication."
        required: false

permissions: {}

jobs:
  validate-workflow:
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
    outputs:
      matches: ${{ steps.check.outputs.matches }}
      preview: ${{ steps.check.outputs.preview }}
    steps:
      - name: Validate runner dependencies
        run: |
          set -euo pipefail
          missing=()
          for cmd in gh jq; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              missing+=("$cmd")
            fi
          done
          if ((${#missing[@]})); then
            printf 'Missing required command(s): %s\n' "${missing[*]}" >&2
            printf 'Install the missing command(s) on the runner image or choose a runner that already provides them.\n' >&2
            exit 1
          fi

      - name: Compare caller workflow file to default branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          ALLOW_BRANCH_PREVIEW: ${{ inputs.allow_branch_preview }}
          SKILL_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          prefix="$REPO/"
          path="${WORKFLOW_REF#"$prefix"}"
          path="${path%@*}"
          echo "Caller workflow file: $path"

          default_branch=$(gh api "repos/$REPO" --jq '.default_branch')

          read_content_field() {
            local ref="$1"
            local field="$2"
            local err
            err=$(mktemp)
            if gh api "repos/$REPO/contents/$path?ref=$ref" --jq ".$field" 2>"$err"; then
              rm -f "$err"
              return 0
            fi
            local status=$?
            if grep -q 'Not Found' "$err"; then
              rm -f "$err"
              return 2
            fi
            cat "$err" >&2
            rm -f "$err"
            return "$status"
          }

          head_content_status=0
          head_content=$(read_content_field "$HEAD_SHA" content) || head_content_status=$?
          if [[ "$head_content_status" == "2" ]]; then
            head_content=""
          elif [[ "$head_content_status" != "0" ]]; then
            exit "$head_content_status"
          fi

          head_sha_blob_status=0
          head_sha_blob=$(read_content_field "$HEAD_SHA" sha) || head_sha_blob_status=$?
          if [[ "$head_sha_blob_status" == "2" ]]; then
            head_sha_blob=""
          elif [[ "$head_sha_blob_status" != "0" ]]; then
            exit "$head_sha_blob_status"
          fi

          default_sha_blob_status=0
          default_sha_blob=$(read_content_field "$default_branch" sha) || default_sha_blob_status=$?
          if [[ "$default_sha_blob_status" == "2" ]]; then
            default_sha_blob=""
          elif [[ "$default_sha_blob_status" != "0" ]]; then
            exit "$default_sha_blob_status"
          fi

          preview_allowed=false
          if [[ "$ALLOW_BRANCH_PREVIEW" == "true" && "$HEAD_REPO" == "$BASE_REPO" && -n "$head_content" ]]; then
            if printf '%s' "$head_content" | base64 --decode | grep -q '# BETA TESTER:'; then
              preview_allowed=true
            fi
          fi

          if [[ ! "$SKILL_REF" =~ ^[0-9a-fA-F]{40}$ && "$preview_allowed" != "true" ]]; then
            echo "::error::inputs.ref must be a full 40-character commit SHA unless allow_branch_preview is true for a same-repo caller carrying the # BETA TESTER: marker."
            exit 1
          fi

          if [[ -z "$default_sha_blob" ]]; then
            if [[ "$preview_allowed" == "true" ]]; then
              echo "::notice::Workflow file '$path' is not on $default_branch yet; allowing same-repo beta preview."
              echo "matches=true" >> "$GITHUB_OUTPUT"
              echo "preview=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Workflow file '$path' is not on $default_branch yet. Merge the workflow first, then subsequent PRs can run verification."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "preview=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$head_sha_blob" ]]; then
            echo "::notice::Workflow file '$path' is not present at the PR head; nothing to verify."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "preview=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$head_sha_blob" != "$default_sha_blob" ]]; then
            if [[ "$preview_allowed" == "true" ]]; then
              echo "::notice::Workflow file '$path' differs from $default_branch; allowing same-repo beta preview."
              echo "matches=true" >> "$GITHUB_OUTPUT"
              echo "preview=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Workflow file '$path' at PR head differs from $default_branch. Land the workflow change first, then this verification run can proceed."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "preview=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Workflow file at PR head matches $default_branch; verification can proceed"
          echo "matches=true" >> "$GITHUB_OUTPUT"
          echo "preview=false" >> "$GITHUB_OUTPUT"

  authorize:
    needs: validate-workflow
    if: needs.validate-workflow.outputs.matches == 'true'
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check PR author permission
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$PR_AUTHOR" ]]; then
            echo "::notice::No PR author in the event payload; skipping verification"
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          err=$(mktemp)
          perm_status=0
          perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq '.permission' 2>"$err") || perm_status=$?
          if [[ "$perm_status" != "0" ]]; then
            if grep -q 'Not Found' "$err"; then
              perm="none"
            else
              cat "$err" >&2
              rm -f "$err"
              exit "$perm_status"
            fi
          fi
          rm -f "$err"
          case "$perm" in
            admin|maintain|write)
              echo "PR author '$PR_AUTHOR' has '$perm' permission on $REPO; verification authorized"
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::PR author '$PR_AUTHOR' has '$perm' permission on $REPO; skipping verification"
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  filter-changes:
    needs: [authorize, validate-workflow]
    if: needs.authorize.outputs.authorized == 'true' && needs.validate-workflow.outputs.matches == 'true'
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      changed_files: ${{ steps.filter.outputs.changed_files }}
    steps:
      - name: Resolve changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PATH_FILTERS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          changed_files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [[ -z "$changed_files" ]]; then
            echo "::notice::Pull request has no changed files; skipping verification"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "changed_files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          file_count=$(wc -l <<< "$changed_files" | tr -d ' ')

          should_run=false
          if [[ -z "${PATH_FILTERS//[[:space:]]/}" ]]; then
            should_run=true
          elif ((file_count >= 3000)); then
            echo "::notice::Pull request file list reached GitHub's 3000-file cap; running verification instead of trusting a partial path-filter result"
            should_run=true
          else
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              while IFS= read -r pattern; do
                [[ -z "${pattern//[[:space:]]/}" ]] && continue
                # Path filters are documented as globs, so the pattern is intentionally unquoted.
                # shellcheck disable=SC2254
                case "$file" in
                  $pattern)
                    should_run=true
                    break 2
                    ;;
                esac
              done <<< "$PATH_FILTERS"
            done <<< "$changed_files"
          fi

          if [[ "$should_run" != "true" ]]; then
            echo "::notice::No changed files matched the configured verification paths; skipping agent run"
          fi

          delim="FILES_${RANDOM}${RANDOM}${RANDOM}"
          {
            echo "should_run=$should_run"
            echo "changed_files<<${delim}"
            echo "$changed_files"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  run-verification:
    needs: [authorize, filter-changes, validate-workflow]
    if: needs.authorize.outputs.authorized == 'true' && needs.filter-changes.outputs.should_run == 'true' && needs.validate-workflow.outputs.matches == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ inputs.skill }}-${{ inputs.concurrency_suffix }}
      cancel-in-progress: true
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve pull request diff refs
        id: diff-refs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          {
            echo "base_ref=$merge_base"
            echo "head_ref=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout verification skill source
        env:
          SKILL_REPOSITORY: ${{ inputs.skill_repository }}
          SKILL_REF: ${{ inputs.ref }}
          SKILL_SOURCE_ROOT: ${{ runner.temp }}/verification-skill-source
        run: |
          set -euo pipefail
          if ! [[ "$SKILL_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::skill_repository must use the owner/repo form."
            exit 1
          fi
          if ! [[ "$SKILL_REF" =~ ^[A-Za-z0-9._/@-]+$ ]] || [[ "$SKILL_REF" == -* ]]; then
            echo "::error::ref contains unsupported characters."
            exit 1
          fi
          rm -rf "$SKILL_SOURCE_ROOT"
          git init "$SKILL_SOURCE_ROOT"
          git -C "$SKILL_SOURCE_ROOT" remote add origin "https://github.com/${SKILL_REPOSITORY}.git"
          git -C "$SKILL_SOURCE_ROOT" fetch --depth=1 origin "$SKILL_REF"
          git -C "$SKILL_SOURCE_ROOT" checkout --detach FETCH_HEAD

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - name: Install verification CLIs
        env:
          AGENT: ${{ inputs.agent }}
          SPX_VERSION: ${{ inputs.spx_version }}
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          set -euo pipefail
          packages=("@outcomeeng/spx@$SPX_VERSION")
          case "$AGENT" in
            claude-code)
              packages+=("@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION")
              ;;
            codex)
              packages+=("@openai/codex@$CODEX_VERSION")
              ;;
            *)
              echo "::error::Unsupported verification agent '$AGENT'. Supported values: claude-code, codex."
              exit 1
              ;;
          esac
          npm install --global "${packages[@]}"
          spx --version
          if [[ "$AGENT" == "claude-code" ]]; then
            claude --version
          else
            codex --version
          fi

      - name: Validate verification inputs
        env:
          AGENT: ${{ inputs.agent }}
          SKILL: ${{ inputs.skill }}
          SKILL_PATH: ${{ inputs.skill_path }}
          SKILL_SOURCE_ROOT: ${{ runner.temp }}/verification-skill-source
          ANTHROPIC_API_KEY_VALUE: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN_VALUE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_ACCESS_TOKEN_VALUE: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$SKILL" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::skill must contain only letters, numbers, underscores, or hyphens."
            exit 1
          fi
          if [[ -z "$SKILL_PATH" || "$SKILL_PATH" == /* || "$SKILL_PATH" == *..* || "$SKILL_PATH" == -* || ! "$SKILL_PATH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::skill_path must be a relative path within the skill repository and must not contain '..'."
            exit 1
          fi
          if [[ ! -d "$SKILL_SOURCE_ROOT/$SKILL_PATH/skills/$SKILL" ]]; then
            echo "::error::Skill '$SKILL' was not found under '$SKILL_PATH/skills'."
            exit 1
          fi
          case "$AGENT" in
            claude-code)
              if [[ ! -f "$SKILL_SOURCE_ROOT/$SKILL_PATH/.claude-plugin/plugin.json" ]]; then
                echo "::error::Skill plugin path '$SKILL_PATH' does not contain .claude-plugin/plugin.json."
                exit 1
              fi
              if [[ -z "${ANTHROPIC_API_KEY_VALUE//[[:space:]]/}" && -z "${CLAUDE_CODE_OAUTH_TOKEN_VALUE//[[:space:]]/}" ]]; then
                echo "::error::The verification host requires either ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN for Claude Code."
                exit 1
              fi
              ;;
            codex)
              if [[ ! -f "$SKILL_SOURCE_ROOT/$SKILL_PATH/.codex-plugin/plugin.json" ]]; then
                echo "::error::Skill plugin path '$SKILL_PATH' does not contain .codex-plugin/plugin.json."
                exit 1
              fi
              if [[ ! -f "$SKILL_SOURCE_ROOT/.agents/plugins/marketplace.json" ]]; then
                echo "::error::The skill repository does not contain .agents/plugins/marketplace.json for Codex-native installation."
                exit 1
              fi
              plugin_name=$(jq -er '.name' "$SKILL_SOURCE_ROOT/$SKILL_PATH/.codex-plugin/plugin.json")
              plugin_source_path=$(jq -er --arg name "$plugin_name" '.plugins[] | select(.name == $name) | .source.path' "$SKILL_SOURCE_ROOT/.agents/plugins/marketplace.json")
              if [[ "$plugin_source_path" != ./* || "$plugin_source_path" == *..* ]]; then
                echo "::error::Codex marketplace source for plugin '$plugin_name' must be a repository-relative local path without '..'."
                exit 1
              fi
              if [[ ! -d "$SKILL_SOURCE_ROOT/${plugin_source_path#./}/skills/$SKILL" ]]; then
                echo "::error::Codex marketplace plugin '$plugin_name' does not contain skill '$SKILL' at its packaged source path."
                exit 1
              fi
              if [[ -z "${CODEX_ACCESS_TOKEN_VALUE//[[:space:]]/}" ]]; then
                echo "::error::The verification host requires CODEX_ACCESS_TOKEN for subscription-backed Codex authentication."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported verification agent '$AGENT'. Supported values: claude-code, codex."
              exit 1
              ;;
          esac

      - name: Prepare Codex adapter
        if: inputs.agent == 'codex'
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          CODEX_HOME: ${{ runner.temp }}/verification-codex-home
          SKILL_PATH: ${{ inputs.skill_path }}
          SKILL_SOURCE_ROOT: ${{ runner.temp }}/verification-skill-source
        run: |
          set -euo pipefail
          umask 077
          rm -rf "$CODEX_HOME"
          mkdir -p "$CODEX_HOME/rules"
          printf '%s\n' \
            'approval_policy = "untrusted"' \
            'default_permissions = "verification"' \
            '' \
            '[permissions.verification.filesystem]' \
            '":minimal" = "read"' \
            '":tmpdir" = "write"' \
            '' \
            '[permissions.verification.filesystem.":workspace_roots"]' \
            '"." = "read"' \
            '".spx" = "write"' \
            > "$CODEX_HOME/config.toml"
          printf '%s\n' \
            'prefix_rule(pattern = ["spx", "journal", ["open", "append", "read", "seal", "render"]], decision = "allow")' \
            'prefix_rule(pattern = ["date"], decision = "allow")' \
            'prefix_rule(pattern = ["mktemp"], decision = "allow")' \
            'prefix_rule(pattern = ["printf"], decision = "allow")' \
            'prefix_rule(pattern = ["python3"], decision = "allow")' \
            'prefix_rule(pattern = ["rm", "-rf"], decision = "allow")' \
            'prefix_rule(pattern = [["cat", "sed", "rg"]], decision = "allow")' \
            > "$CODEX_HOME/rules/verification.rules"
          printf '%s' "$CODEX_ACCESS_TOKEN" | codex login --with-access-token
          unset CODEX_ACCESS_TOKEN

          marketplace_name=$(jq -er '.name' "$SKILL_SOURCE_ROOT/.agents/plugins/marketplace.json")
          plugin_name=$(jq -er '.name' "$SKILL_SOURCE_ROOT/$SKILL_PATH/.codex-plugin/plugin.json")
          codex plugin marketplace add "$SKILL_SOURCE_ROOT" --json
          codex plugin add "$plugin_name@$marketplace_name" --json

      - name: Create verification context
        env:
          BASE_REF: ${{ steps.diff-refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.diff-refs.outputs.head_ref }}
          SKILL: ${{ inputs.skill }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          spx verification-context create \
            --subject changeset \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --predicate "$SKILL" \
            --workflow "$WORKFLOW_REF"

      - name: Run verification skill
        id: verify
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '30') }}
        env:
          AGENT: ${{ inputs.agent }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_HOME: ${{ runner.temp }}/verification-codex-home
          MODEL: ${{ inputs.model }}
          SKILL: ${{ inputs.skill }}
          SKILL_PATH: ${{ inputs.skill_path }}
          SKILL_SOURCE_ROOT: ${{ runner.temp }}/verification-skill-source
          BASE_REF: ${{ steps.diff-refs.outputs.base_ref }}
          HEAD_REF: ${{ steps.diff-refs.outputs.head_ref }}
          CHANGED_FILES: ${{ needs.filter-changes.outputs.changed_files }}
        run: |
          set -euo pipefail
          work_home="$RUNNER_TEMP/verification-home"
          mkdir -p "$work_home"
          if [[ "$AGENT" == "codex" ]]; then
            plugin_name=$(jq -er '.name' "$SKILL_SOURCE_ROOT/$SKILL_PATH/.codex-plugin/plugin.json")
            skill_invocation="\$${plugin_name}:${SKILL}"
          else
            skill_invocation="/$SKILL"
          fi
          prompt=$(printf '%s\n' \
            "Run $skill_invocation against this checked out pull request." \
            "" \
            "Scope:" \
            "- Base ref: $BASE_REF" \
            "- Head ref: $HEAD_REF" \
            "- Changed files:" \
            '```text' \
            "$CHANGED_FILES" \
            '```' \
            "" \
            "Use the skill's journal workflow. Print the raw run token the skill produces.")
          cd "$GITHUB_WORKSPACE"
          if [[ "$AGENT" == "claude-code" ]]; then
            args=(
              --print
              --no-session-persistence
              --plugin-dir "$SKILL_SOURCE_ROOT/$SKILL_PATH"
              --tools "Read,Grep,Glob,Bash"
              --allowedTools "Read,Grep,Glob,Bash(date:*),Bash(mktemp:*),Bash(printf:*),Bash(python3:*),Bash(rm -rf:*),Bash(spx journal open:*),Bash(spx journal append:*),Bash(spx journal read:*),Bash(spx journal seal:*),Bash(spx journal render:*)"
            )
            auth_env=()
            if [[ -n "${ANTHROPIC_API_KEY//[[:space:]]/}" ]]; then
              args=(--bare "${args[@]}")
              auth_env+=(ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY")
            elif [[ -n "${CLAUDE_CODE_OAUTH_TOKEN//[[:space:]]/}" ]]; then
              auth_env+=(CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN")
            fi
            if [[ -n "${MODEL//[[:space:]]/}" ]]; then
              args+=(--model "$MODEL")
            fi
            env -i \
              PATH="$PATH" \
              HOME="$work_home" \
              TMPDIR="$RUNNER_TEMP" \
              TMP="$RUNNER_TEMP" \
              "${auth_env[@]}" \
              SPX_VERIFY_BASE_REF="$BASE_REF" \
              SPX_VERIFY_HEAD_REF="$HEAD_REF" \
              claude "${args[@]}" -- "$prompt" | tee "$RUNNER_TEMP/spec-tree-verification-output.txt"
          else
            codex_tmpdir="$GITHUB_WORKSPACE/.spx/tmp"
            mkdir -p "$codex_tmpdir"
            args=(
              exec
              --ephemeral
              --strict-config
            )
            if [[ -n "${MODEL//[[:space:]]/}" ]]; then
              args+=(--model "$MODEL")
            fi
            env -i \
              PATH="$PATH" \
              HOME="$work_home" \
              CODEX_HOME="$CODEX_HOME" \
              TMPDIR="$codex_tmpdir" \
              TMP="$codex_tmpdir" \
              SPX_VERIFY_BASE_REF="$BASE_REF" \
              SPX_VERIFY_HEAD_REF="$HEAD_REF" \
              codex "${args[@]}" "$prompt" | tee "$RUNNER_TEMP/spec-tree-verification-output.txt"
          fi

      - name: Clean up Codex adapter
        if: always() && inputs.agent == 'codex'
        env:
          CODEX_HOME: ${{ runner.temp }}/verification-codex-home
          CODEX_TMPDIR: ${{ github.workspace }}/.spx/tmp
        run: |
          set -euo pipefail
          rm -rf "$CODEX_HOME" "$CODEX_TMPDIR"

      - name: Publish job summary
        if: always()
        env:
          SKILL: ${{ inputs.skill }}
          SKILL_REPOSITORY: ${{ inputs.skill_repository }}
          SKILL_REF: ${{ inputs.ref }}
          PREVIEW_MODE: ${{ needs.validate-workflow.outputs.preview }}
        run: |
          set -euo pipefail
          {
            echo "## Spec Tree Verification"
            echo
            echo "- Skill: \`$SKILL\`"
            echo "- Skill repository: \`$SKILL_REPOSITORY\`"
            echo "- Skill ref: \`$SKILL_REF\`"
            echo "- Preview mode: \`$PREVIEW_MODE\`"
            echo
            echo "### Output"
            echo
            if [[ -f "$RUNNER_TEMP/spec-tree-verification-output.txt" ]]; then
              echo '```text'
              sed -n '1,240p' "$RUNNER_TEMP/spec-tree-verification-output.txt"
              total_lines=$(wc -l < "$RUNNER_TEMP/spec-tree-verification-output.txt" | tr -d ' ')
              if ((total_lines > 240)); then
                echo
                echo "[output truncated at 240 of $total_lines lines]"
              fi
              echo '```'
              token=$(awk 'NF { candidate = $NF } END { print candidate }' "$RUNNER_TEMP/spec-tree-verification-output.txt")
              journal_type=""
              if [[ "$SKILL" == "review-changes" ]]; then
                journal_type="review"
              fi
              if [[ -n "$journal_type" && "$token" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{3}-[0-9a-f]+$ ]]; then
                echo
                echo "### Journal"
                echo
                echo '```text'
                if ! spx journal render --type "$journal_type" --run "$token"; then
                  echo "Unable to render journal for token: $token"
                fi
                echo '```'
              fi
            else
              echo '```text'
              echo "No verification output captured."
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

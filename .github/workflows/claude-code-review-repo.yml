# Run the reusable Claude Code Review workflow on this repository.
#
# `ready_for_review` is omitted from the trigger types deliberately: the
# event always fires on a SHA that the previous opened/synchronize already
# reviewed, so subscribing to it would duplicate every promotion review.

name: Claude Code Review Repo

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: ./.github/workflows/claude-code-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      concurrency_cancel: true
      # Wall-clock budget for the Run Claude Code Review step. Default '15'
      # in the reusable workflow; override at runtime by setting the
      # CLAUDE_REVIEW_TIMEOUT_MINUTES repo variable (Settings → Secrets and
      # variables → Actions → Variables) to e.g. '5' to fail fast when a
      # run hangs. Minimum 1; '0' is silently rejected by GitHub Actions.
      # The reusable input is typed as string so `vars.*` (always a string)
      # and the quoted fallback both pass through unchanged.
      timeout_minutes: ${{ vars.CLAUDE_REVIEW_TIMEOUT_MINUTES || '15' }}

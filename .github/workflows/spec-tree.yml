# Reusable Spec Tree mention workflow.
#
# Forwards every input through to `claude.yml`. Today there is no spec-tree-
# specific default that differs from the generic mention workflow — including
# `use_project_plugins`, which defaults to `false` here for the same reasons
# documented on `claude.yml` (plugin skills' ALWAYS-invoke mandates pull
# mention runs off-task into tools that aren't part of the original intent).
# The wrapper exists as a stable name for spec-tree consumers; consumers that
# want methodology skills available in mention runs should opt in by setting
# `use_project_plugins: true` AND registering the relevant marketplaces under
# `extraKnownMarketplaces` in their `.claude/settings.json`.
#
# Usage in caller workflow:
#
#   on:
#     issue_comment:
#       types: [created, edited]
#     pull_request_review_comment:
#       types: [created, edited]
#     issues:
#       types: [opened, assigned]
#     pull_request_review:
#       types: [submitted]
#
#   jobs:
#     spec-tree:
#       uses: outcomeeng/gh-actions/.github/workflows/spec-tree.yml@<full-commit-sha> # main
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

name: Spec Tree

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner selection — see claude.yml for full semantics."
        type: string
        default: ubuntu-slim
      trigger_phrase:
        description: |
          Text that triggers the workflow. Defaults to `@spec-tree` so a repo
          that also installs the generic `claude.yml` caller (which defaults to
          `@claude`) routes mentions to the right workflow — same `@claude`
          mention would otherwise fire both callers.
        type: string
        default: "@spec-tree"
      concurrency_cancel:
        description: "Cancel in-progress runs when a new mention arrives."
        type: boolean
        default: true
      custom_prompt:
        description: "Custom prompt to override default behavior."
        type: string
        default: ""
      model:
        description: "Claude model to use. Empty means defer to the action's default."
        type: string
        default: ""
      claude_args:
        description: "Extra Claude Code CLI args."
        type: string
        default: ""
      use_bedrock:
        description: "Route Claude through Amazon Bedrock."
        type: boolean
        default: false
      use_vertex:
        description: "Route Claude through Google Vertex AI."
        type: boolean
        default: false
      additional_env:
        description: "JSON object string of env vars to set on the claude-code-action step."
        type: string
        default: "{}"
      use_project_plugins:
        description: |
          Install plugins declared in the consumer's .claude/settings.json.
          Defaults to `false` to match `claude.yml`: plugin skills with
          ALWAYS-invoke mandates can pull a mention run into long detours
          through tools that aren't part of the mention's intent. Opt in by
          setting this to `true` AND registering the plugins' hosting
          marketplaces under `extraKnownMarketplaces` in your
          `.claude/settings.json` (entries with `source.source == "github"`);
          the marketplace registration is what claude-code-action uses to
          resolve each `<plugin>@<owner>` spec at install time, without it
          the plugin list is forwarded but cannot be installed.
        type: boolean
        default: false
      plugin_marketplaces:
        description: "Space-separated additional marketplaces."
        type: string
        default: ""
      extra_plugins:
        description: "Space-separated additional plugins."
        type: string
        default: ""
      show_full_output:
        description: "Stream the full per-turn JSON output to the job log (may include sensitive content)."
        type: boolean
        default: false
      timeout_minutes:
        description: "Wall-clock budget (in minutes) for the Run Claude Code step. See claude.yml for the full contract; declared as a string so callers can forward a `vars.*` repo variable directly."
        type: string
        default: "15"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token. Not required when use_bedrock or use_vertex is true."
        required: false

# No top-level `permissions:` on this wrapper. Setting it to `{}` would zero
# the permission chain for the called workflow (claude.yml), causing every
# downstream job's permission request to be denied at startup. The called
# workflow declares its own per-job permissions; the caller workflow's
# `permissions:` block sets the maximum.

jobs:
  spec-tree:
    uses: ./.github/workflows/claude.yml
    secrets: inherit
    with:
      runner: ${{ inputs.runner }}
      trigger_phrase: ${{ inputs.trigger_phrase }}
      concurrency_cancel: ${{ inputs.concurrency_cancel }}
      custom_prompt: ${{ inputs.custom_prompt }}
      model: ${{ inputs.model }}
      claude_args: ${{ inputs.claude_args }}
      use_bedrock: ${{ inputs.use_bedrock }}
      use_vertex: ${{ inputs.use_vertex }}
      additional_env: ${{ inputs.additional_env }}
      use_project_plugins: ${{ inputs.use_project_plugins }}
      plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
      extra_plugins: ${{ inputs.extra_plugins }}
      show_full_output: ${{ inputs.show_full_output }}
      timeout_minutes: ${{ inputs.timeout_minutes }}

# Run the reusable Claude Code mention workflow on this repository.

name: Claude Code Repo

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: ./.github/workflows/claude.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # Wall-clock budget for the Run Claude Code step. Default 15 in the
      # reusable workflow; override at runtime by setting the
      # CLAUDE_TIMEOUT_MINUTES repo variable (Settings → Secrets and
      # variables → Actions → Variables) to e.g. '5' to fail fast when a
      # mention task hangs. Minimum 1; '0' is silently rejected by GitHub
      # Actions. GitHub variables are strings, so parse the variable
      # before passing it to the reusable workflow's numeric input.
      timeout_minutes: ${{ fromJSON(vars.CLAUDE_TIMEOUT_MINUTES || '15') }}

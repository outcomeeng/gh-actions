# Run the spec-tree review reusable on this repository as a self-test.
#
# `ready_for_review` is omitted from the trigger types deliberately: the
# event always fires on a SHA that the previous opened/synchronize already
# reviewed, so subscribing to it would duplicate every promotion review.

name: Claude Code Spec Tree Review Repo

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  spec-tree-review:
    uses: ./.github/workflows/spec-tree-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # Override at runtime via the CLAUDE_REVIEW_TIMEOUT_MINUTES repo
      # variable. GitHub variables are strings; wrap with fromJSON so the
      # typed numeric input receives a real number rather than relying on
      # implicit coercion.
      timeout_minutes: ${{ fromJSON(vars.CLAUDE_REVIEW_TIMEOUT_MINUTES || '15') }}

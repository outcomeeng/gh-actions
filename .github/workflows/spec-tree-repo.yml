# Run the spec-tree mention reusable on this repository as a self-test.

name: Spec Tree

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  spec-tree:
    uses: ./.github/workflows/spec-tree.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # Override at runtime via the CLAUDE_TIMEOUT_MINUTES repo variable
      # (Settings → Secrets and variables → Actions → Variables). The
      # reusable input is typed as string so `vars.*` (always a string) and
      # the quoted fallback both pass through unchanged.
      timeout_minutes: ${{ vars.CLAUDE_TIMEOUT_MINUTES || '30' }}
      # gh-actions's own .claude/settings.json enables prose@outcomeeng and
      # spec-tree@outcomeeng, but `use_project_plugins` defaults to false on
      # `spec-tree.yml`, so this self-test exercises the trigger/auth
      # plumbing without installing project plugins. To exercise the
      # plugin-install path end-to-end, set `use_project_plugins: true`
      # below AND register marketplaces under `extraKnownMarketplaces` in
      # `.claude/settings.json`.

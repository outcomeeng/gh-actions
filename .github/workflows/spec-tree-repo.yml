# Run the spec-tree mention reusable on this repository as a self-test.

name: Spec Tree

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  spec-tree:
    uses: ./.github/workflows/spec-tree.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # Override at runtime via the CLAUDE_TIMEOUT_MINUTES repo variable
      # (Settings → Secrets and variables → Actions → Variables). The
      # reusable input is typed as string so `vars.*` (always a string) and
      # the quoted fallback both pass through unchanged.
      timeout_minutes: ${{ vars.CLAUDE_TIMEOUT_MINUTES || '15' }}
      # gh-actions's own .claude/settings.json enables prose@outcomeeng and
      # spec-tree@outcomeeng, so use_project_plugins (defaults to true) will
      # list both for installation. No `extraKnownMarketplaces` is declared,
      # however, so the marketplace list passed to claude-code-action is
      # empty — this self-test exercises the workflow plumbing rather than
      # asserting a successful plugin install.

# Reusable Claude Code Review workflow for automatic PR reviews
#
# Usage in caller workflow:
#
#   on:
#     pull_request:
#       types: [opened, synchronize]
#
#   jobs:
#     review:
#       uses: outcomeeng/gh-actions/.github/workflows/claude-code-review.yml@main
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

name: Claude Code Review

on:
  workflow_call:
    inputs:
      authorized_roles:
        description: "(Deprecated, ignored.) Authorization is now determined by querying the repo-permission API for the PR author."
        type: string
        default: ""
      concurrency_cancel:
        description: "Cancel in-progress reviews when PR is updated"
        type: boolean
        default: false
      allowed_tools:
        description: "Claude Code --allowed-tools argument"
        type: string
        default: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
      custom_prompt:
        description: "Custom review prompt (replaces default)"
        type: string
        default: ""
      plugin_marketplaces:
        description: "Space-separated list of extra marketplaces to register beyond `.claude/settings.json`'s `extraKnownMarketplaces` (owner/repo, ref ignored — pin via settings.json)"
        type: string
        default: ""
      extra_plugins:
        description: "Space-separated extra plugins to install beyond `.claude/settings.json`'s `enabledPlugins`"
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token"
        required: true

jobs:
  claude-review:
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: ${{ inputs.concurrency_cancel }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Authorize PR author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          DEPRECATED_ROLES: ${{ inputs.authorized_roles }}
        run: |
          set -euo pipefail
          if [[ -n "$DEPRECATED_ROLES" ]]; then
            echo "::warning::The 'authorized_roles' input is deprecated and ignored. Authorization now uses the repo-permission API."
          fi
          if [[ -z "$PR_AUTHOR" ]]; then
            echo "::error::No PR author in the event payload"
            exit 1
          fi
          perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          case "$perm" in
            admin|maintain|write)
              echo "PR author '$PR_AUTHOR' has '$perm' permission on $REPO — review authorized"
              ;;
            *)
              echo "::error::PR author '$PR_AUTHOR' has '$perm' permission on $REPO; review requires admin, maintain, or write"
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Derive plugin and marketplace inputs
        id: plugins
        shell: bash
        env:
          PLUGIN_MARKETPLACES: ${{ inputs.plugin_marketplaces }}
          EXTRA_PLUGINS: ${{ inputs.extra_plugins }}
        run: |
          set -euo pipefail
          plugins=""
          marketplaces=""

          if [[ -f .claude/settings.json ]]; then
            jq empty .claude/settings.json
            plugins=$(jq -r '.enabledPlugins // {} | to_entries[] | select(.value == true) | .key' .claude/settings.json)
            marketplaces=$(jq -r '
              .extraKnownMarketplaces // {} | to_entries[]
              | select(.value.source.source == "github")
              | "https://github.com/" + .value.source.repo + ".git"
            ' .claude/settings.json)
          fi

          for p in $EXTRA_PLUGINS; do
            [[ -z "$p" ]] && continue
            plugins=$(printf '%s\n%s' "$plugins" "$p")
          done

          for m in $PLUGIN_MARKETPLACES; do
            [[ -z "$m" ]] && continue
            repo=${m%@*}
            marketplaces=$(printf '%s\n%s' "$marketplaces" "https://github.com/${repo}.git")
          done

          plugins=$(echo "$plugins" | sed '/^$/d')
          marketplaces=$(echo "$marketplaces" | sed '/^$/d')

          delim="MULTILINE_$(uuidgen)"
          {
            echo "plugins<<${delim}"
            echo "$plugins"
            echo "${delim}"
            echo "marketplaces<<${delim}"
            echo "$marketplaces"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

          echo "::group::Derived plugin install inputs"
          echo "plugins:"
          echo "$plugins"
          echo "marketplaces:"
          echo "$marketplaces"
          echo "::endgroup::"

      - name: Set review prompt
        id: set-prompt
        run: |
          if [ -n "${{ inputs.custom_prompt }}" ]; then
            delimiter="CLAUDE_PROMPT_$(uuidgen)"
            {
              echo "prompt<<$delimiter"
              echo "${{ inputs.custom_prompt }}"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "prompt<<EOF"
              cat <<'PROMPT_EOF'
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          Please review this pull request and provide feedback on:
          - Code quality and best practices
          - Potential bugs or issues
          - Performance considerations
          - Security concerns
          - Test coverage

          Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

          Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.
          PROMPT_EOF
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@fefa07e9c665b7320f08c3b525980457f22f58aa # v1.0.111
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.set-prompt.outputs.prompt }}
          claude_args: ${{ inputs.allowed_tools }}
          plugins: ${{ steps.plugins.outputs.plugins }}
          plugin_marketplaces: ${{ steps.plugins.outputs.marketplaces }}

# Reusable Claude Code Review workflow for automatic PR reviews
#
# Status: COMPATIBILITY-ONLY. New repositories should use spec-tree-review.yml
# instead — it bakes in a REVIEW.md-aware review prompt and extends the
# baseline allowlist for the diff-chunking workflow. This generic workflow
# stays supported for callers that need to supply a fully custom prompt via
# the `custom_prompt` input (which spec-tree-review.yml deliberately does
# not expose).
#
# Usage in caller workflow:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#
#   jobs:
#     review:
#       uses: outcomeeng/gh-actions/.github/workflows/claude-code-review.yml@<full-commit-sha> # main
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# Optional inputs cover model selection, full claude_args passthrough,
# custom trigger phrase, Bedrock/Vertex routing, and a runner override.
#
# `ready_for_review` is deliberately omitted from the recommended trigger
# types: it always fires on a SHA the previous `opened` or `synchronize`
# already reviewed (no commits land at the draft→ready transition), so
# subscribing to it would burn a redundant review on every promotion.
#
# Bootstrap steps (plugin derivation, claude_args composition, additional env
# application) are factored into composite actions under .github/actions/.
# This workflow checks out gh-actions at its OWN ref into a `.gh-actions/`
# subdirectory so the composite actions are pinned to the same commit as
# the workflow file the consumer pinned. The composite ref tracks the
# workflow ref automatically — no separate pin to maintain.

name: Claude Code Review

on:
  workflow_call:
    inputs:
      runner:
        description: |
          Runner selection for all three jobs. Accepts either:
          - A single label: 'ubuntu-slim', 'ubuntu-latest', 'self-hosted'
          - A JSON array of labels: '["self-hosted","laptop"]'
          The wrapper detects which form was passed and dispatches correctly.
          Security: self-hosted runners must not be used from public repos or repos that accept PRs from untrusted forks. The reusable-workflow validate-workflow gate restricts what untrusted PRs can change, but the runner host itself is shared across runs. Only set a self-hosted runner here when every PR contributor is trusted (typical for private org repos).
        type: string
        default: ubuntu-slim
      concurrency_cancel:
        description: "Cancel in-progress reviews when PR is updated."
        type: boolean
        default: true
      custom_prompt:
        description: "Custom review prompt (replaces the default review prompt)."
        type: string
        default: ""
      model:
        description: "Claude model to use, e.g. claude-opus-4-7. Folded into claude_args as --model. Empty means use the action's default."
        type: string
        default: ""
      claude_args:
        description: |
          Extra CLI arguments for Claude Code OTHER than --allowed-tools.
          For tool restrictions, use append_allow_list / override_allow_list.
          Examples: '--max-turns 20', '--debug', '--mcp-config /path/to/cfg'.
        type: string
        default: ""
      append_allow_list:
        description: |
          Comma-separated tool patterns appended to the wrapper's baseline
          allowlist (Bash(gh ...) for reading PR context and posting the
          review comment). Use Claude Code's --allowed-tools pattern syntax.
          Example: 'Bash(make test:*),Bash(yarn lint:*)'
          Ignored when override_allow_list is set.
        type: string
        default: ""
      override_allow_list:
        description: |
          Comma-separated tool patterns that replace the wrapper's baseline
          allowlist entirely. Use Claude Code's --allowed-tools pattern syntax.
          Example: 'Bash(gh pr view:*),Bash(gh pr comment:*)'
          Use when you need a strictly narrower (or different) allowlist than
          the bake-in.
        type: string
        default: ""
      trigger_phrase:
        description: "Trigger phrase for @-mention activation. Defaults to @claude."
        type: string
        default: "@claude"
      use_bedrock:
        description: "Route Claude through Amazon Bedrock instead of the Claude API. Caller is responsible for AWS auth (e.g. via aws-actions/configure-aws-credentials in a wrapping workflow) and for setting AWS_REGION via additional_env."
        type: boolean
        default: false
      use_vertex:
        description: "Route Claude through Google Vertex AI instead of the Claude API. Caller is responsible for GCP auth (e.g. via google-github-actions/auth) and for setting ANTHROPIC_VERTEX_PROJECT_ID / CLOUD_ML_REGION / VERTEX_REGION_* via additional_env."
        type: boolean
        default: false
      additional_env:
        description: "JSON object string of env vars to set on the claude-code-action step. Used to pass cloud-provider config (AWS_REGION, ANTHROPIC_VERTEX_PROJECT_ID, etc.) without changing the action invocation."
        type: string
        default: "{}"
      use_project_plugins:
        description: |
          When true, read `.claude/settings.json` from the caller repository and install the plugins it declares under `enabledPlugins` plus the marketplaces under `extraKnownMarketplaces`. Default false so the review job runs with no project plugins — many plugins ship skills with "ALWAYS invoke before X" mandates that pull Claude into tools (Read, Grep, Glob, git) outside the wrapper's allowlist, burning turns on permission denials before any review comment is posted. Set true only when the project plugins are review-appropriate and the allowlist is widened to match (via append_allow_list / override_allow_list).
        type: boolean
        default: false
      plugin_marketplaces:
        description: "Space-separated list of marketplaces to register (`owner/repo`, ref ignored — pin via the marketplace repo). Appends to the project's `extraKnownMarketplaces` when use_project_plugins is true; sole source when false."
        type: string
        default: ""
      extra_plugins:
        description: "Space-separated list of plugins to install. Appends to the project's `enabledPlugins` when use_project_plugins is true; sole source when false."
        type: string
        default: ""
      show_full_output:
        description: |
          Stream the full per-turn JSON output from Claude Code to the job log instead of the default redacted summary. Useful when the review run takes longer than expected and you want visibility into what Claude is doing turn-by-turn. WARNING (per the upstream action): the full output includes ALL tool execution results, which may contain secrets, API keys, or other sensitive material from the repo. GitHub Actions job logs are visible to anyone with read access to the repository (and to the public for public repos). Only enable when debugging in a non-sensitive context.
        type: boolean
        default: false
      timeout_minutes:
        description: |
          Wall-clock budget (in minutes) for the Run Claude Code Review step. When exceeded, GitHub cancels the step with a clear timeout message; the post-action cleanup steps (token revocation, buffered inline comments, workspace cleanup) still run, so the runner is left in a clean state. Default 15 covers a typical review with headroom. Lower it (e.g. to '5') to fail fast when a run hangs, or raise it for repositories where reviews legitimately take longer. Minimum meaningful value is 1; GitHub Actions silently rejects `timeout-minutes: 0` at runtime. Applies only to the Claude Code Action step; the authorize and validate-workflow jobs are short-lived and not gated by this input. Declared as a string so callers can forward a `vars.*` repo variable directly (`vars.*` always reads as a string); numeric literals like `15` are also accepted because GitHub Actions coerces them to strings on input.
        type: string
        default: "15"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token. Not required when use_bedrock or use_vertex is true (cloud credentials provide auth in those cases)."
        required: false

# Deny-all default at the workflow level. Each job below explicitly grants
# the narrow permissions it needs (subject to the caller workflow's maximum
# grant). This guards against future jobs accidentally inheriting broad
# permissions; see https://docs.github.com/en/actions/security-guides/automatic-token-authentication.
permissions: {}

jobs:
  authorize:
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check PR author permission
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$PR_AUTHOR" ]]; then
            echo "::notice::No PR author in the event payload; skipping review"
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          case "$perm" in
            admin|maintain|write)
              echo "PR author '$PR_AUTHOR' has '$perm' permission on $REPO — review authorized"
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::PR author '$PR_AUTHOR' has '$perm' permission on $REPO; skipping review (review requires admin, maintain, or write)"
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  validate-workflow:
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
    outputs:
      matches: ${{ steps.check.outputs.matches }}
    steps:
      - name: Compare caller workflow file to default branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # github.workflow_ref is "<owner>/<repo>/<path>@<ref>".
          prefix="$REPO/"
          path="${WORKFLOW_REF#"$prefix"}"
          path="${path%@*}"
          echo "Caller workflow file: $path"

          default_branch=$(gh api "repos/$REPO" --jq '.default_branch')
          head_sha_blob=$(gh api "repos/$REPO/contents/$path?ref=$HEAD_SHA" --jq '.sha' 2>/dev/null || echo "")
          default_sha_blob=$(gh api "repos/$REPO/contents/$path?ref=$default_branch" --jq '.sha' 2>/dev/null || echo "")

          if [[ -z "$default_sha_blob" ]]; then
            echo "::notice::Workflow file '$path' is not on $default_branch yet. The Anthropic action requires the caller workflow file to exist on the default branch with identical content. Merge this PR (or a workflow-only PR that lands the file first) into $default_branch, then subsequent PRs will be reviewed automatically."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$head_sha_blob" ]]; then
            echo "::notice::Workflow file '$path' is not present at the PR head; nothing to review here."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$head_sha_blob" != "$default_sha_blob" ]]; then
            echo "::notice::Workflow file '$path' at PR head differs from $default_branch. The Anthropic action requires identical content for security. Land the workflow change on $default_branch first (a workflow-only PR is the typical approach), then this PR will be reviewed automatically."
            echo "matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Workflow file at PR head matches $default_branch — review can proceed"
          echo "matches=true" >> "$GITHUB_OUTPUT"

  claude-review:
    needs: [authorize, validate-workflow]
    if: needs.authorize.outputs.authorized == 'true' && needs.validate-workflow.outputs.matches == 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: ${{ inputs.concurrency_cancel }}
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # so the Resolve gh-actions SHA step can read referenced_workflows

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # Determine the SHA at which the CALLER pinned this reusable workflow,
      # so the next step checks out the composite actions at that same SHA.
      # `github.workflow_ref` is NOT usable here: in a reusable workflow it
      # refers to the caller's workflow file at the caller's ref (typically
      # `refs/pull/N/merge` on a consumer PR), which does not exist in
      # outcomeeng/gh-actions. Instead we read the run's `referenced_workflows`
      # field, which resolves every `uses:` reference (cross-repo and relative)
      # to an absolute `<owner>/<repo>/<path>@<sha>` form, and pull the SHA of
      # the first outcomeeng/gh-actions entry. This works for direct consumer
      # callers, for callers via the spec-tree wrappers (relative `uses:` from
      # spec-tree-review.yml resolves to outcomeeng/gh-actions/...@same-sha),
      # and for this repo's own self-tests.
      - name: Resolve gh-actions SHA
        id: workflow-ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # Resolve the consumer-pinned SHA via the GitHub REST API. We use
          # `curl` + `python3` rather than `gh` because the ubuntu-slim Docker
          # image (the default runner) ships without the `gh` CLI; curl and
          # python3 are part of the base image. The `|| sha=""` suffix on the
          # assignment prevents `set -e` from aborting the step when the API
          # call returns non-zero (for example a 403 when the caller workflow
          # omits the `actions: read` grant), so the empty-string fallback
          # below can fire instead.
          sha=$(
            curl --silent --show-error --fail \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}" \
            | python3 -c "import json, sys; d = json.load(sys.stdin); print(next((w['sha'] for w in d.get('referenced_workflows', []) if w.get('path', '').startswith('outcomeeng/gh-actions/')), ''))"
          ) || sha=""
          if [ -z "${sha}" ]; then
            # Fallback for callers that did not grant `actions: read`, for
            # manual-dispatch edge cases the API does not list, or for runner
            # images that lack curl/python3.
            sha="${WORKFLOW_REF##*@}"
            echo "::warning::Could not resolve outcomeeng/gh-actions SHA via referenced_workflows; falling back to caller ref ${sha}"
          fi
          echo "ref=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-actions for composite actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: outcomeeng/gh-actions
          ref: ${{ steps.workflow-ref.outputs.ref }}
          path: .gh-actions
          # No push back to outcomeeng/gh-actions from this step — drop the
          # default token persistence so a later step can't reuse it.
          persist-credentials: false

      - name: Derive Claude plugins and marketplaces
        id: plugins
        uses: ./.gh-actions/.github/actions/derive-claude-plugins
        with:
          use_project_plugins: ${{ inputs.use_project_plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          extra_plugins: ${{ inputs.extra_plugins }}

      - name: Compose claude_args
        id: claude-args
        uses: ./.gh-actions/.github/actions/compose-claude-args
        with:
          model: ${{ inputs.model }}
          extra_args: ${{ inputs.claude_args }}
          baseline_allow_list: "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
          append_allow_list: ${{ inputs.append_allow_list }}
          override_allow_list: ${{ inputs.override_allow_list }}

      - name: Apply additional env
        uses: ./.gh-actions/.github/actions/apply-additional-env
        with:
          additional_env: ${{ inputs.additional_env }}

      - name: Set review prompt
        id: set-prompt
        env:
          # Pass `custom_prompt` via env (not via inline ${{ }} interpolation
          # in the run block) so any backticks, `$(...)`, embedded heredocs,
          # or unquoted metacharacters in the prompt body are treated as
          # opaque text by bash. Inline ${{ inputs.custom_prompt }} inside
          # `echo "..."` lets bash re-parse the substituted content, which
          # broke when the spec-tree-review wrapper added a documentation
          # table whose cell contained `<<'EOF' … EOF` — bash opened a
          # command substitution at the backtick and never found EOF.
          CUSTOM_PROMPT: ${{ inputs.custom_prompt }}
        run: |
          set -euo pipefail
          delimiter="CLAUDE_PROMPT_$(cat /proc/sys/kernel/random/uuid)"
          if [ -n "$CUSTOM_PROMPT" ]; then
            {
              echo "prompt<<$delimiter"
              printf '%s\n' "$CUSTOM_PROMPT"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "prompt<<$delimiter"
              cat <<'PROMPT_EOF'
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          Please review this pull request and provide feedback on:
          - Code quality and best practices
          - Potential bugs or issues
          - Performance considerations
          - Security concerns
          - Test coverage

          Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

          Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.
          PROMPT_EOF
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code Review
        id: claude-review
        # `inputs.timeout_minutes` is declared as a string (so callers can
        # forward a `vars.*` value directly), but step-level `timeout-minutes:`
        # rejects string values outright. fromJSON() parses "15" back to the
        # integer 15 that the field expects. The `|| '15'` fallback covers
        # the edge case where a caller passes `timeout_minutes: ""`
        # explicitly (which overrides the input default) — without it,
        # fromJSON("") would throw an opaque workflow error.
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '15') }}
        uses: anthropics/claude-code-action@51ea8ea73a139f2a74ff649e3092c25a904aed7e # v1.0.123
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.set-prompt.outputs.prompt }}
          claude_args: ${{ steps.claude-args.outputs.args }}
          trigger_phrase: ${{ inputs.trigger_phrase }}
          use_bedrock: ${{ inputs.use_bedrock }}
          use_vertex: ${{ inputs.use_vertex }}
          plugins: ${{ steps.plugins.outputs.plugins }}
          plugin_marketplaces: ${{ steps.plugins.outputs.marketplaces }}
          show_full_output: ${{ inputs.show_full_output }}

# Run the product-tree verification host on this repository as a branch-preview
# self-test. The preview mode exists so a branch can test changes to the
# reusable and to a skill ref before either is released to SHA-pinned callers.

name: Product Tree Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  product-tree-verification:
    # BETA TESTER: this in-repository caller deliberately allows branch refs
    # for the verification skill so maintainers can test a skill branch with
    # this workflow branch. Production callers must SHA-pin the skill ref.
    uses: ./.github/workflows/product-tree-verification.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
    with:
      skill: ${{ vars.PRODUCT_TREE_VERIFICATION_SKILL || 'review-changes' }}
      skill_repository: ${{ vars.PRODUCT_TREE_VERIFICATION_SKILL_REPOSITORY || 'outcomeeng/plugins' }}
      ref: ${{ vars.PRODUCT_TREE_VERIFICATION_SKILL_REF || 'main' }}
      skill_path: ${{ vars.PRODUCT_TREE_VERIFICATION_SKILL_PATH || 'src/plugins/product-tree' }}
      agent: ${{ vars.PRODUCT_TREE_VERIFICATION_AGENT || 'claude-code' }}
      model: ${{ vars.PRODUCT_TREE_VERIFICATION_MODEL || '' }}
      paths: ${{ vars.PRODUCT_TREE_VERIFICATION_PATHS || '' }}
      timeout_minutes: ${{ vars.PRODUCT_TREE_VERIFICATION_TIMEOUT_MINUTES || '30' }}
      allow_branch_preview: true

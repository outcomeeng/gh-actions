# Reusable Claude Code workflow for @claude mentions
#
# Usage in caller workflow:
#
#   on:
#     issue_comment:
#       types: [created, edited]
#     pull_request_review_comment:
#       types: [created, edited]
#     issues:
#       types: [opened, assigned]
#     pull_request_review:
#       types: [submitted]
#
#   jobs:
#     claude:
#       uses: outcomeeng/gh-actions/.github/workflows/claude.yml@main
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

name: Claude Code

on:
  workflow_call:
    inputs:
      authorized_roles:
        description: "(Deprecated, ignored.) Authorization is now determined by querying the repo-permission API for the actor."
        type: string
        default: ""
      mention_trigger:
        description: "Text that triggers the workflow"
        type: string
        default: "@claude"
      concurrency_cancel:
        description: "Cancel in-progress runs when new mention arrives"
        type: boolean
        default: true
      allowed_tools:
        description: "Claude Code --allowed-tools argument (empty = unrestricted)"
        type: string
        default: ""
      custom_prompt:
        description: "Custom prompt to override default behavior"
        type: string
        default: ""
      plugin_marketplaces:
        description: "Space-separated list of extra marketplaces to register beyond `.claude/settings.json`'s `extraKnownMarketplaces` (owner/repo, ref ignored — pin via settings.json)"
        type: string
        default: ""
      extra_plugins:
        description: "Space-separated extra plugins to install beyond `.claude/settings.json`'s `enabledPlugins`"
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token"
        required: true

jobs:
  claude:
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: ${{ inputs.concurrency_cancel }}
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, inputs.mention_trigger)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, inputs.mention_trigger)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, inputs.mention_trigger)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, inputs.mention_trigger) || contains(github.event.issue.title, inputs.mention_trigger)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Authorize actor
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          DEPRECATED_ROLES: ${{ inputs.authorized_roles }}
        run: |
          set -euo pipefail
          if [[ -n "$DEPRECATED_ROLES" ]]; then
            echo "::warning::The 'authorized_roles' input is deprecated and ignored. Authorization now uses the repo-permission API."
          fi
          if [[ -z "$ACTOR" ]]; then
            echo "::error::No actor in the event payload"
            exit 1
          fi
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          case "$perm" in
            admin|maintain|write)
              echo "Actor '$ACTOR' has '$perm' permission on $REPO — mention authorized"
              ;;
            *)
              echo "::error::Actor '$ACTOR' has '$perm' permission on $REPO; @claude requires admin, maintain, or write"
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Derive plugin and marketplace inputs
        id: plugins
        shell: bash
        env:
          PLUGIN_MARKETPLACES: ${{ inputs.plugin_marketplaces }}
          EXTRA_PLUGINS: ${{ inputs.extra_plugins }}
        run: |
          set -euo pipefail
          plugins=""
          marketplaces=""

          if [[ -f .claude/settings.json ]]; then
            jq empty .claude/settings.json
            plugins=$(jq -r '.enabledPlugins // {} | to_entries[] | select(.value == true) | .key' .claude/settings.json)
            marketplaces=$(jq -r '
              .extraKnownMarketplaces // {} | to_entries[]
              | select(.value.source.source == "github")
              | "https://github.com/" + .value.source.repo + ".git"
            ' .claude/settings.json)
          fi

          for p in $EXTRA_PLUGINS; do
            [[ -z "$p" ]] && continue
            plugins=$(printf '%s\n%s' "$plugins" "$p")
          done

          for m in $PLUGIN_MARKETPLACES; do
            [[ -z "$m" ]] && continue
            repo=${m%@*}
            marketplaces=$(printf '%s\n%s' "$marketplaces" "https://github.com/${repo}.git")
          done

          plugins=$(echo "$plugins" | sed '/^$/d')
          marketplaces=$(echo "$marketplaces" | sed '/^$/d')

          delim="MULTILINE_$(uuidgen)"
          {
            echo "plugins<<${delim}"
            echo "$plugins"
            echo "${delim}"
            echo "marketplaces<<${delim}"
            echo "$marketplaces"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

          echo "::group::Derived plugin install inputs"
          echo "plugins:"
          echo "$plugins"
          echo "marketplaces:"
          echo "$marketplaces"
          echo "::endgroup::"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@fefa07e9c665b7320f08c3b525980457f22f58aa # v1.0.111
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: ${{ inputs.custom_prompt }}
          claude_args: ${{ inputs.allowed_tools }}
          plugins: ${{ steps.plugins.outputs.plugins }}
          plugin_marketplaces: ${{ steps.plugins.outputs.marketplaces }}
